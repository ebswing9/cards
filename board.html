<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국어누리게임 - 칠판 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{ margin:0; user-select:none; }
  .b-wrap{ min-height:100vh; display:flex; flex-direction:column; padding:12px 22px 14px; gap:14px; max-width:1900px; margin:0 auto; }

  /* 상단 바 */
  .b-top{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .b-title{ font-size:20px; color:var(--primary-dark); }
  .b-clock{ font-size:44px; font-weight:900; color:var(--primary-dark); background:#fff; border-radius:999px; padding:0 30px; line-height:1.35; box-shadow:0 6px 18px rgba(118,159,205,0.22); font-variant-numeric:tabular-nums; }
  .b-clock.warn{ color:#C93049; animation:warnPulse 1s ease-in-out infinite; }
  @keyframes warnPulse{ 50%{ transform:scale(1.06); } }
  .b-tools{ display:flex; gap:10px; }
  .b-ib{ width:46px; height:46px; border-radius:50%; border:2px solid var(--primary-pale); background:#fff; color:var(--primary-dark); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 12px rgba(118,159,205,0.2); transition:transform 0.12s, background 0.12s; padding:0; }
  .b-ib:hover{ transform:translateY(-2px); background:var(--primary-tint); }
  .b-ib:disabled{ opacity:0.38; cursor:default; transform:none; background:#fff; }
  .b-ib svg{ width:24px; height:24px; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .b-ib.pause{ color:#B87300; background:var(--gold-tint); border-color:#F6D88A; }
  .b-ib.muted{ color:var(--ink-soft); }

  /* 팀 카드: 위쪽 띠가 팀 색이에요 */
  .b-teams{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; padding-top:26px; }
  .b-team{ position:relative; background:#fff; border:4px solid var(--line); border-radius:26px; padding:0 14px 14px; text-align:center; box-shadow:0 8px 22px rgba(118,159,205,0.18); transition:transform 0.2s; }
  .b-team-head{ background:var(--tc); color:var(--on); margin:-4px -18px 6px; padding:8px 10px; border-radius:22px 22px 0 0; font-size:clamp(22px,1.9vw,32px); font-weight:900; }
  .b-score{ font-size:clamp(54px,5vw,84px); font-weight:900; line-height:1.05; color:var(--ink); }
  .b-score small{ font-size:0.32em; margin-left:4px; color:var(--ink-soft); font-family:'Pretendard',sans-serif; font-weight:800; }
  .b-chips{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .b-team .hand-chip{ width:64px; padding:3px 3px 5px; border-radius:14px; }
  .b-team .hand-chip .ico{ height:34px; margin-bottom:3px; }
  .b-team .hand-chip .lb{ font-size:12px; white-space:nowrap; }
  .b-team .hand-chip .n{ min-width:22px; height:22px; font-size:12px; top:-8px; right:-8px; }
  .b-team .hand-chip .use-tag{ font-size:10.5px; padding:1px 8px; }
  /* 현재 차례: 팀 색으로 발광 */
  .b-team.current{ border-color:var(--td); animation:teamGlow 1.4s ease-in-out infinite; transform:translateY(-3px); }
  @keyframes teamGlow{
    0%,100%{ box-shadow:0 0 8px 1px var(--tg), 0 6px 16px rgba(0,0,0,0.06); }
    50%{ box-shadow:0 0 28px 9px var(--tg2), 0 6px 16px rgba(0,0,0,0.06); }
  }
  .b-turn-tag{ position:absolute; top:-26px; left:50%; transform:translateX(-50%); z-index:2; background:var(--td); color:#fff; font-family:'Pretendard',sans-serif; font-weight:800; font-size:14px; padding:2px 16px; border-radius:999px; border:3px solid #fff; white-space:nowrap; }
  .b-team.pickable{ cursor:pointer; border-color:var(--td); animation:pickPulse 1s ease-in-out infinite; }
  .b-team.pickable:hover{ transform:translateY(-4px) scale(1.02); }
  @keyframes pickPulse{ 0%,100%{ box-shadow:0 0 0 0 var(--tg2); } 50%{ box-shadow:0 0 0 12px rgba(255,255,255,0); } }
  .b-chip{ display:inline-block; padding:0 22px; border-radius:999px; margin:0 4px; line-height:1.4; }

  /* 가운데 무대 */
  .b-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:14px 0; text-align:center; min-height:0; }
  .b-stage .center-card.is-question{ width:min(1240px,94%); margin-top:36px; margin-bottom:8px; }
  .b-stage .qpaper{ min-height:clamp(170px,21vh,250px); padding:34px 28px 30px; }
  .b-stage .qpaper .qtext{ font-size:clamp(36px,4vw,72px); line-height:1.5; }
  .b-stage .center-card.is-question .type-tag{ font-size:clamp(16px,1.4vw,22px); }
  .b-line{ font-size:clamp(26px,2.6vw,44px); font-weight:900; color:var(--ink); }
  .b-sub{ font-family:'Pretendard',sans-serif; font-weight:700; font-size:clamp(16px,1.3vw,22px); color:var(--ink-soft); }
  .b-draw{ font-family:var(--font-main); font-weight:700; font-size:clamp(26px,2.3vw,38px); padding:12px 50px; border:4px solid #fff; border-radius:999px; cursor:pointer; color:#fff; background:linear-gradient(155deg,#8FB6E4,#4A72A8); box-shadow:0 10px 24px rgba(74,114,168,0.4); }
  .b-draw:active{ transform:scale(0.96); }
  body.board .deck-pile{ height:130px; width:140px; margin:0 auto; }
  body.board .deck-pile .card-back{ width:88px; height:124px; }
  .b-judge{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .b-judge button{ font-family:'Pretendard',sans-serif; font-weight:800; font-size:clamp(18px,1.6vw,26px); padding:10px 30px; border:none; border-radius:16px; color:#fff; cursor:pointer; min-width:150px; }
  .b-judge .j-ok{ background:linear-gradient(155deg,#43D49A,#1FA971); box-shadow:0 6px 16px rgba(31,169,113,0.35); }
  .b-judge .j-no{ background:linear-gradient(155deg,#FF8095,#E8465F); box-shadow:0 6px 16px rgba(232,70,95,0.35); }
  .b-judge .j-unk{ background:linear-gradient(155deg,#A9B9C8,#6E8196); box-shadow:0 6px 16px rgba(110,129,150,0.3); }
  .b-judge .j-pass{ background:#fff; color:#2E9C78; border:3px solid #2E9C78; min-width:0; }
  .b-pending{ font-family:'Pretendard',sans-serif; font-weight:800; font-size:clamp(14px,1.15vw,18px); background:#fff; border-radius:16px; padding:8px 20px; box-shadow:0 8px 22px rgba(118,159,205,0.22); display:flex; gap:20px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .b-pending .btn{ padding:5px 16px; font-size:13px; }
  .b-timer{ font-family:'Pretendard',sans-serif; font-weight:800; font-size:20px; padding:4px 18px; border-radius:999px; background:#fff; color:var(--primary-dark); }
  .b-timer.over{ background:#E8465F; color:#fff; animation:warnPulse 0.8s ease-in-out infinite; }
  .b-pickrow{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .b-pickrow button{ font-family:var(--font-main); font-weight:700; font-size:clamp(22px,2vw,32px); padding:12px 30px; border-radius:20px; border:4px solid var(--tc); cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,0.12); }
  .b-pickrow button:hover{ transform:translateY(-3px); }
  .b-pickrow button.skip{ background:#fff; border-color:var(--ink-soft); color:var(--ink-soft); font-family:'Pretendard',sans-serif; font-weight:800; font-size:20px; box-shadow:none; }
  .b-slide{ display:flex; align-items:center; gap:14px; font-family:'Pretendard',sans-serif; font-weight:800; font-size:20px; color:var(--primary-dark); background:#fff; border:2px solid var(--primary-pale); border-radius:20px; padding:12px 18px 12px 14px; cursor:pointer; box-shadow:0 6px 16px rgba(118,159,205,0.2); transition:transform 0.12s, box-shadow 0.12s, border-color 0.12s; }
  .b-slide:hover{ transform:translateY(-3px); border-color:#8FB6E4; box-shadow:0 10px 22px rgba(118,159,205,0.3); }
  .b-slide .ic{ width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:none; }
  .b-slide .ic svg{ width:26px; height:26px; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; fill:none; }
  .b-slide .ic.unk{ background:linear-gradient(155deg,#A9B9C8,#6E8196); }
  .b-slide .ic.inc{ background:linear-gradient(155deg,#FF8095,#E8465F); }
  .b-slide .ct{ background:var(--primary-tint); color:var(--primary-dark); border-radius:999px; padding:2px 12px; font-size:16px; }
  .b-slide .go{ font-size:22px; color:#8FB6E4; }
  .b-slide:disabled{ opacity:0.45; cursor:default; transform:none; box-shadow:none; border-color:var(--line); }
  .b-def{ display:flex; flex-direction:column; gap:12px; align-items:center; }
  .b-def-row{ display:flex; gap:14px; align-items:center; background:#fff; border-radius:20px; padding:10px 22px; font-size:clamp(20px,1.8vw,28px); font-weight:900; box-shadow:0 6px 16px rgba(118,159,205,0.18); }
  .b-def-row button{ font-family:'Pretendard',sans-serif; font-weight:800; font-size:20px; padding:8px 22px; border-radius:14px; border:none; cursor:pointer; color:#fff; }
  .b-def-row .d-yes{ background:#2F63A8; } .b-def-row .d-no{ background:#8196AA; }
  .b-def-done{ font-family:'Pretendard',sans-serif; font-weight:800; font-size:18px; color:var(--ink-soft); }

  /* 하단 */
  .b-foot{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; }
  .b-log{ font-family:'Pretendard',sans-serif; font-weight:600; font-size:15px; color:var(--ink-soft); line-height:1.6; min-height:60px; }
  .b-log div:first-child{ color:var(--ink); font-weight:800; }
  .b-keys{ font-family:'Pretendard',sans-serif; font-weight:700; font-size:13px; color:var(--ink-soft); text-align:right; line-height:1.9; }
  .b-keys b{ background:#fff; border:1.5px solid var(--line); border-radius:7px; padding:0 7px; margin:0 3px 0 10px; color:var(--primary-dark); }

  /* 결과 */
  .b-rank{ display:flex; flex-direction:column; gap:9px; width:min(900px,92%); }
  .b-rank-row{ display:flex; align-items:center; gap:22px; background:#fff; border-radius:24px; padding:6px 30px 6px 0; overflow:hidden; box-shadow:0 8px 20px rgba(118,159,205,0.2); }
  .b-rank-row .bar{ align-self:stretch; width:18px; background:var(--tc); }
  .b-rank-row .rk{ font-size:clamp(30px,3vw,50px); font-weight:900; width:110px; white-space:nowrap; color:var(--ink); }
  .b-rank-row .nm{ flex:1; text-align:left; font-size:clamp(24px,2.3vw,40px); font-weight:400; line-height:1.25; }
  .b-rank-row .sc{ font-size:clamp(30px,3vw,50px); font-weight:900; color:var(--ink); white-space:nowrap; }
  .b-rank-row .st{ font-family:'Pretendard',sans-serif; font-weight:700; font-size:16px; color:var(--ink-soft); }
  .b-rank-row.first{ background:linear-gradient(160deg,#fff,#E2EEFB); box-shadow:0 0 0 3px #8FB6E4, 0 10px 24px rgba(74,114,168,0.25); }

  /* 알림(토스트)은 팀 카드 아래쪽에 */
  body.board .game-notice{ top:clamp(300px,34vh,420px); max-width:min(90vw,720px); font-size:clamp(20px,1.6vw,28px); padding:16px 34px; }

  /* 시간 초과 전체 화면 효과 */
  .silence-fx.fx-timeup{ background:radial-gradient(circle at 50% 45%, rgba(190,50,70,0.62), rgba(70,10,25,0.93)); }
  .fx-timeup .sfx-icon{ animation:sfxPop 0.5s cubic-bezier(.2,1.2,.3,1) both, clockShake 0.3s linear 0.5s infinite; }
  .fx-timeup .sfx-icon::before, .fx-timeup .sfx-icon::after{ border-color:rgba(255,200,210,0.8); }
  @keyframes clockShake{ 0%,100%{ transform:rotate(-9deg); } 50%{ transform:rotate(9deg); } }

  /* 화면 높이가 낮은 PC에서도 한 화면에 다 보이도록 */
  @media (max-height:960px){
    .b-wrap{ gap:8px; padding:8px 18px 10px; }
    .b-teams{ padding-top:26px; gap:12px; }
    .b-team-head{ font-size:22px; padding:5px 8px; margin-bottom:3px; }
    .b-score{ font-size:clamp(38px,6vh,62px); }
    .b-team .hand-chip{ width:58px; }
    .b-team .hand-chip .ico{ height:28px; }
    .b-chips{ margin-top:5px; }
    .b-stage{ gap:10px; padding:6px 0; }
    .b-line{ font-size:clamp(22px,3.4vh,36px); }
    .b-stage .center-card.is-question{ margin-top:26px; }
    .b-stage .qpaper{ min-height:120px; padding:22px 18px 20px; }
    .b-stage .qpaper .qtext{ font-size:clamp(28px,5vh,54px); }
    body.board .deck-pile{ height:96px; } body.board .deck-pile .card-back{ width:66px; height:94px; }
    .b-clock{ font-size:34px; }
    .b-log{ min-height:34px; font-size:14px; }
    .b-judge button{ padding:8px 26px; }
  }
  @media (max-height:780px){
    .b-team-head{ font-size:19px; padding:3px 8px; }
    .b-score{ font-size:clamp(32px,5.4vh,46px); }
    .b-team .hand-chip{ width:52px; } .b-team .hand-chip .ico{ height:24px; } .b-team .hand-chip .lb{ font-size:11px; }
    .b-stage .qpaper{ min-height:92px; padding:16px 14px 14px; }
    .b-stage .qpaper .qtext{ font-size:clamp(24px,4.8vh,40px); }
    .b-line{ font-size:clamp(20px,3.2vh,28px); }
    .b-sub{ font-size:14px; }
    body.board .deck-pile{ height:76px; } body.board .deck-pile .card-back{ width:52px; height:74px; }
    .b-log div:nth-child(n+3){ display:none; }
    .b-clock{ font-size:28px; }
  }

  /* 5팀 이상: 한 줄에 다 들어가도록 작은 카드로 */
  .b-teams.many{ grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:10px; }
  .b-teams.many .b-team{ padding:0 8px 10px; border-radius:20px; }
  .b-teams.many .b-team-head{ margin:-4px -12px 4px; font-size:clamp(15px,1.35vw,24px); padding:6px 4px; border-radius:16px 16px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .b-teams.many .b-score{ font-size:clamp(34px,3.4vw,58px); }
  .b-teams.many .b-chips{ display:grid; grid-template-columns:repeat(2,1fr); justify-items:center; gap:7px 4px; }
  .b-teams.many .hand-chip{ width:min(100%,58px); }
  .b-teams.many .hand-chip .use-tag{ font-size:9.5px; padding:1px 6px; }
  @media (max-height:960px){
    .b-teams.many .hand-chip{ width:min(100%,48px); padding:2px 2px 3px; }
    .b-teams.many .hand-chip .ico{ height:22px; margin-bottom:1px; }
    .b-teams.many .hand-chip .lb{ display:none; }
    .b-teams.many .b-score{ font-size:clamp(30px,5vh,46px); }
    .b-rank{ gap:5px; }
    .b-rank-row{ padding:3px 24px 3px 0; }
    .b-rank-row .rk{ font-size:clamp(24px,3.4vh,36px); width:84px; }
    .b-rank-row .nm{ font-size:clamp(20px,3vh,30px); }
    .b-rank-row .sc{ font-size:clamp(24px,3.4vh,36px); }
    .b-rank-row .st{ font-size:13px; }
    .b-slide{ padding:8px 14px 8px 10px; font-size:17px; }
    .b-slide .ic{ width:36px; height:36px; }
  }
  @media (max-height:800px){
    .b-rank-row .st{ display:none; }
    .b-stage .b-sub{ font-size:13px; }
  }

  .b-teams.many ~ .b-stage{ gap:10px; }
  .b-teams.many ~ .b-stage .qpaper{ min-height:clamp(140px,17vh,200px); padding:26px 24px 24px; }
  .b-rank.many .b-rank-row{ padding:3px 24px 3px 0; }
  .b-rank.many .b-rank-row .rk{ font-size:clamp(26px,3.4vh,40px); width:96px; }
  .b-rank.many .b-rank-row .nm{ font-size:clamp(22px,3vh,32px); }
  .b-rank.many .b-rank-row .sc{ font-size:clamp(26px,3.4vh,40px); }
  @media (max-height:780px){ .b-teams.many ~ .b-stage .b-sub{ display:none; } }

  @media (max-height:780px){ .b-pickrow{ gap:8px; } .b-pickrow button{ padding:7px 16px; font-size:19px; border-width:3px; } .b-pickrow button.skip{ font-size:15px; } .b-stage .center-card.is-question{ margin-top:22px; } }
</style>
</head>
<body class="board">
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game-logic.js"></script>
<script src="db.js"></script>
<script>
// ======================================================
// 모둠 간 경쟁 - 칠판 화면 (교사 PC → 전자칠판)
// 학급 하나가 게임 한 판이고, 모둠(팀)이 플레이어예요. 선생님이 전부 조작해요.
// ======================================================
const GI = 1;
const gameId = new URLSearchParams(location.search).get('game');
const app = document.getElementById('app');
let game = null;
let scheduled = {};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
// 색 헬퍼: 팀 색 위에 올릴 글자색, 반투명 색, 팀 이름표
function lum(hex){
  const n = parseInt(hex.slice(1), 16), f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f((n >> 16) & 255) + 0.7152 * f((n >> 8) & 255) + 0.0722 * f(n & 255);
}
const onColor = hex => lum(hex) > 0.34 ? '#2C3E50' : '#FFFFFF';
function rgba(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
function deep(hex, f){ f = f || 0.6; const n = parseInt(hex.slice(1), 16); return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.round(v * f).toString(16).padStart(2, '0')).join(''); }
function chip(id){ const c = tColor(id); return `<span class="b-chip" style="background:${c};color:${onColor(c)}">${esc(tName(id))}</span>`; }
function msgScreen(text){ return `<div class="center-screen"><div class="card-box"><h2>${esc(text)}</h2></div></div>`; }

// ---------- 한국어 조사 ----------
function hasBatchim(w){
  const ch = String(w).trim().slice(-1); const c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
  if (/[0-9]/.test(ch)) return '013678'.includes(ch);
  return false;
}
const ga = w => w + (hasBatchim(w) ? '이' : '가');
const scoreLabel = t => (t === 'general' || t === 'steal') ? '점수 카드' : CARD_LABELS[t];
function reul(w){ return w + (hasBatchim(w) ? '을' : '를'); }

// ---------- 데이터 접근 ----------
const META = () => game.meta;
const GRP = () => (game.groups || {})[GI] || {};
const teamIds = () => computeOrder(GRP().seats, GRP().excludedIds);
function tName(id){ const t = (META().teams || {})[id]; return t ? t.name : (((game.players || {})[id] || {}).name || '?'); }
function tColor(id){ const t = (META().teams || {})[id]; return t ? t.color : '#4A72A8'; }
const handOf = id => (GRP().hands || {})[id] || emptyHand();

// ======================================================
// 효과음 (파일 없이 브라우저에서 직접 만든 소리)
// ======================================================
let audioCtx = null;
let muted = localStorage.getItem('board_muted') === '1';
function ac(){
  if (!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, at, dur, type, vol, slideTo){
  const c = audioCtx; if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  const t0 = c.currentTime + at;
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);

let seen = null;

function detectEvents(){
  const m = META(), g = GRP();
  const cur = {
    silence: (g.lastSilence || {}).ts || 0, steal: (g.lastStealReveal || {}).ts || 0,
    draw: (g.lastDraw || {}).ts || 0, effect: (g.lastEffect || {}).ts || 0,
    phase: g.phase, pjResult: (g.pendingJudge || {}).result || null, pjDeadline: (g.pendingJudge || {}).deadline || 0, status: m.status
  };
  if (!seen){ seen = cur; if (cur.phase === 'ended' || cur.status === 'ended') setTimeout(launchConfetti, 500); return; }
  if (cur.silence && cur.silence !== seen.silence){
    sfx('silence');
    playFx('silence', '쉿… 침묵 카드!', `${esc(ga(tName(g.lastSilence.playerId)))} 침묵 카드를 뽑아서<br>이번 턴은 쉬어요`, 3600);
  }
  if (cur.steal && cur.steal !== seen.steal){

    playFx('steal', '사실은 강탈 카드!', `${esc(tName(g.lastStealReveal.playerId))}의 문제는 강탈 카드였어요!<br>누구의 카드를 뺏을까요?`, 3600);
  }
  if (cur.draw && cur.draw !== seen.draw){

    pushNotice(`${esc(ga(tName(d.playerId)))} ${esc(reul(CARD_LABELS[d.type]))} 뽑았어요!`, 3200);
  }
  if (cur.effect && cur.effect !== seen.effect){
    const e = g.lastEffect;
    if (!e.success) sfx('defense'); else sfx(e.effect === 'steal' ? 'steal' : e.effect);
    pushNotice(effectText(e), 4200);
  }
  if (seen.phase === 'pre_turn' && cur.phase === 'awaiting_answer') sfx('draw');
  if (cur.phase === 'judge_pending' && seen.phase !== 'judge_pending') sfx('pick');
  if (seen.phase === 'judge_pending' && cur.phase !== 'judge_pending' && serverNow() >= seen.pjDeadline - 400){
    sfx(seen.pjResult === 'correct' ? 'correct' : seen.pjResult === 'incorrect' ? 'wrong' : 'unknown');
  }
  if (cur.phase === 'ended' && seen.phase !== 'ended'){ sfx('end'); launchConfetti(); }
  seen = cur;
}
function launchConfetti(){
  const old = document.getElementById('confettiCv'); if (old) old.remove();
  const cv = document.createElement('canvas');
  cv.id = 'confettiCv';
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:98;';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, s = H / 1080;
  const colors = ['#B7B1F2', '#FDB7EA', '#FFDCCC', '#FBF3B9', '#B5DFF7', '#C8EBB6', '#FFC83D', '#8FB6E4', '#FF8095'];
  const parts = [];
  const rnd = (a, b2) => a + Math.random() * (b2 - a);
  function burst(side, n){
    for (let i = 0; i < n; i++){
      const ang = rnd(-1.35, -0.55);                    // 위로 비스듬히 (라디안)
      const sp = rnd(16, 30) * s;
      const dir = side === 'L' ? 1 : -1;
      parts.push({ x: side === 'L' ? -10 : W + 10, y: H * rnd(0.72, 0.95), vx: Math.cos(ang) * sp * dir * -1 * -1, vy: Math.sin(ang) * sp,
        size: rnd(9, 18) * Math.max(0.7, s), rot: rnd(0, 6.28), vr: rnd(-0.25, 0.25), color: colors[(Math.random() * colors.length) | 0],
        shape: Math.random() < 0.3 ? 'c' : 'r', life: 0, max: rnd(150, 230) });
      parts[parts.length - 1].vx = Math.abs(parts[parts.length - 1].vx) * dir;
    }
  }
  [0, 450, 950].forEach(t => setTimeout(() => { burst('L', 45); burst('R', 45); }, t));
  const t0 = performance.now();
  (function frame(now){
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    parts.forEach(p => {
      p.life++; if (p.life > p.max) return; alive++;
      p.vy += 0.45 * s; p.vx *= 0.985; p.vy *= 0.992;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, (p.max - p.life) / 40);
      ctx.fillStyle = p.color;
      if (p.shape === 'c'){ ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, 6.28); ctx.fill(); }
      else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();

  })(t0);
}

  const t = turnRemainingSec();
  if (t != null && t <= 0){
    const k = GRP().turnNumber;
    if (k !== overKey){ overKey = k; sfx('over'); playFx('timeup', '시간 초과!', '이제 정리하고 답을 정해 주세요', 2800); }

function clockMs(){
  const m = META();
  if (m.status === 'playing') return Math.max(0, (m.endAt || 0) - serverNow());
  if (m.status === 'paused') return m.remainingMsAtPause || 0;
  if (m.status === 'lobby') return (m.durationMinutes || 0) * 60000;
  return 0;
}
function turnRemainingSec(){
  const g = GRP(), sec = META().turnTimerSec;
  if (!sec || META().status !== 'playing') return null;
  if (['pre_turn', 'awaiting_answer', 'challenge_pick', 'challenge_answer'].indexOf(g.phase) === -1) return null;
  return sec - Math.floor((serverNow() - (g.turnStartedAt || serverNow())) / 1000);
}

  if (result === 'unknown' && g.phase !== 'awaiting_answer') return;
  const sec = m.judgeCancelSec != null ? m.judgeCancelSec : 3;
  act(() => proposeJudge(gameId, GI, g.judgeId, result, sec * 1000));

// 예약 작업 (판정 확정 / 방어 처리 / 시간 종료)
// ======================================================
function sched(key, deadline, fn){
  if (scheduled[key]) return;
  scheduled[key] = setTimeout(() => { delete scheduled[key]; fn(); }, Math.max(0, deadline - serverNow()) + 150);
}
function scheduleWork(){
  const m = META(), g = GRP();
  if (m.status !== 'playing') return;
  if (g.phase === 'judge_pending' && g.pendingJudge){
    sched('j_' + g.pendingJudge.deadline, g.pendingJudge.deadline, () => resolveJudge(gameId, GI));
  }
  if (g.phase === 'awaiting_defense' && g.defenseWindow){
    const dw = g.defenseWindow, resp = dw.responses || {}, ids = dw.targetIds || [];
    // 방어 카드가 없는 팀은 자동으로 '사용 안 함'
    ids.forEach(id => {
      if (resp[id] === undefined && (handOf(id).defense || 0) <= 0) sched('ad_' + dw.deadline + '_' + id, 0, () => respondDefense(gameId, GI, id, false));
    });
    if (ids.length > 0 && ids.every(id => resp[id] !== undefined)) sched('dall_' + dw.deadline, 0, () => resolveDefenseWindow(gameId, GI));
    else sched('dd_' + dw.deadline, dw.deadline, () => resolveDefenseWindow(gameId, GI));
  }
  if (g.phase === 'pre_turn' && m.endAt && serverNow() >= m.endAt){
    sched('end_' + Math.floor(serverNow() / 3000), 0, () => endGroupIfTimeUp(gameId, GI, m.endAt));
  }
}

  if (g.phase === 'judge_pending' && g.pendingJudge){
    const r = g.pendingJudge.result, sec = Math.max(0, Math.ceil((g.pendingJudge.deadline - serverNow()) / 1000));
    const label = r === 'correct' ? '정답' : r === 'incorrect' ? '오답' : '모두 모름';
    const who = (g.challenge && g.challenge.challengerId) ? g.challenge.challengerId : cur;
    return `<div class="b-line">${chip(who)}</div>${g.currentCard ? questionHtml(g.currentCard) : ''}
      <div class="b-pending"><span>판정: ${label} · ${sec}초 뒤 확정</span><button class="btn btn-ghost" onclick="doCancelJudge()">취소</button></div>`;
  }
  if (g.phase === 'challenge_pick'){
    const tried = (g.challenge || {}).tried || [];
    const left = teamIds().filter(id => tried.indexOf(id) === -1);
    return `<div class="b-line">${tried.length > 1 ? '또 오답!' : chip(cur) + '오답!'} 도전할 모둠을 정해요</div>
      <div class="b-sub">가위바위보로 도전 팀을 정한 뒤 눌러주세요</div>
      ${g.currentCard ? questionHtml(g.currentCard) : ''}
      <div class="b-pickrow">${left.map(id => { const c = tColor(id); return `<button style="--tc:${c};background:${c};color:${onColor(c)}" onclick="pickTeam('${id}')">${esc(tName(id))}</button>`; }).join('')}
        <button class="skip" onclick="doSkipChallenge()">도전 없이 넘어가기</button></div>`;
  }
  if (g.phase === 'challenge_answer' && g.currentCard){
    const ch = (g.challenge || {}).challengerId;
    return `<div class="b-line">${chip(ch)}의 도전!</div>
      ${questionHtml(g.currentCard)}${judgeButtons(false)}`;
  }
  if (g.phase === 'steal_pick'){
    const targets = teamIds().filter(id => id !== cur && handTotal(handOf(id)) > 0);
    return `<div class="b-line">${chip(cur)}의 강탈!</div>
      <div class="b-sub">카드를 뺏을 팀을 눌러주세요 (위쪽 팀 카드를 눌러도 돼요)</div>
      <div class="b-pickrow">${targets.map(id => { const c = tColor(id); return `<button style="--tc:${c};background:${c};color:${onColor(c)}" onclick="pickTeam('${id}')">${esc(tName(id))}</button>`; }).join('')}</div>`;
  }
  if (g.phase === 'awaiting_defense' && g.defenseWindow){
    const dw = g.defenseWindow, resp = dw.responses || {};
    const what = { steal: '강탈', jump: '점프', turn: '전환' }[dw.effect] || dw.effect;
    const rows = (dw.targetIds || []).map(id => {
      const has = (handOf(id).defense || 0) > 0;
      let right;
      if (resp[id] !== undefined) right = `<span class="b-def-done">${resp[id] ? '방어 카드 사용!' : '사용 안 함'}</span>`;
      else if (!has) right = '<span class="b-def-done">방어 카드 없음</span>';
      else right = `<button class="d-yes" onclick="doDefense('${id}', true)">방어 카드 사용</button><button class="d-no" onclick="doDefense('${id}', false)">사용 안 함</button>`;
      return `<div class="b-def-row">${chip(id)}${right}</div>`;
    }).join('');
    return `<div class="b-line">${chip(dw.actorId)}${what} 카드를 썼어요!</div>
      <div class="b-sub">방어 카드가 있는 팀에게 물어보고 눌러주세요</div><div class="b-def">${rows}</div>`;
  }
  return '';
}
function rankingHtml(){
  const g = GRP();
  const rows = teamIds().map(id => ({ id, score: handScore(handOf(id)), st: (g.stats || {})[id] || {}, turns: (g.turnsTaken || {})[id] || 0 }))
    .sort((a, b) => b.score - a.score);
  let rank = 0, prev = null;
  return `<div class="b-rank ${rows.length > 4 ? 'many' : ''}">${rows.map((r, i) => {
    if (r.score !== prev){ rank = i + 1; prev = r.score; }
    return `<div class="b-rank-row ${rank === 1 ? 'first' : ''}" style="--tc:${tColor(r.id)}"><div class="bar"></div>
      <div class="rk">${rank}위</div><div class="nm">${esc(tName(r.id))}<div class="st">턴 ${r.turns}번 · 강탈 성공 ${r.st.steals || 0}회 · 강탈당함 ${r.st.stolen || 0}회</div></div><div class="sc">${r.score}점</div></div>`;
  }).join('')}</div>`;
}
// 결과 화면의 '문제별 슬라이드' 버튼 (관리자 화면의 것과 같아요)
function resultActionsHtml(){
  const u = qStatList('unknown').length, w = qStatList('incorrect').length;
  const icQ = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.8.5-1.2 1-1.2 1.9"/><circle cx="12" cy="17" r=".6" fill="#fff"/></svg>';
  const icX = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
  const btn = (kind, n, cls, ic, label) => `<button class="b-slide" ${n ? `onclick="openStatSlides('${kind}')"` : 'disabled'}>
      <span class="ic ${cls}">${ic}</span><span>${label}</span>${n ? `<span class="ct">${n}문제</span><span class="go">›</span>` : '<span class="ct">없음</span>'}</button>`;
  return `<div class="b-pickrow">${btn('unknown', u, 'unk', icQ, '모두 모름 문제 슬라이드로 보기')}${btn('incorrect', w, 'inc', icX, '오답 많은 문제 슬라이드로 보기')}</div>`;
}
function endReasonText(){
  const r = GRP().endReason;
  return r === 'deck' ? '카드가 모두 소진되어 게임이 끝났어요' : r === 'time' ? '시간이 끝나 마지막 한 바퀴까지 마쳤어요' : '';
}
const ICON_UNDO = '<svg viewBox="0 0 24 24" fill="none"><polyline points="2 4 2 10 8 10"/><path d="M4.2 15a9 9 0 1 0 2.1-9.4L2 10"/></svg>';
const ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.8 5.2a9.5 9.5 0 0 1 0 13.6"/></svg>';
const ICON_MUTE = '<svg viewBox="0 0 24 24" fill="none"><path d="M11 5 6 9H3v6h3l5 4V5z"/><line x1="16" y1="9.5" x2="21.5" y2="15"/><line x1="21.5" y1="9.5" x2="16" y2="15"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="none"><rect x="6" y="5" width="4" height="14" rx="1.6" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1.6" fill="currentColor" stroke="none"/></svg>';
function topHtml(){
  const m = META(), rem = clockMs();
  const cls = (m.status === 'playing' && rem <= 60000) ? 'warn' : '';
  const live = m.status === 'playing' || m.status === 'paused';
  return `<div class="b-top">
    <div class="b-title">국어누리게임 · ${esc(m.className)}</div>
    <div class="b-clock ${cls}">${formatClock(rem)}</div>
    <div class="b-tools">
      ${live ? `<button class="b-ib" title="되돌리기" aria-label="되돌리기" onclick="doUndo()" ${GRP().undo ? '' : 'disabled'}>${ICON_UNDO}</button>` : ''}
      <button class="b-ib ${muted ? 'muted' : ''}" title="${muted ? '소리 켜기' : '소리 끄기'}" aria-label="소리" onclick="toggleMute()">${muted ? ICON_MUTE : ICON_SOUND}</button>
      ${m.status === 'playing' ? `<button class="b-ib pause" title="일시정지" aria-label="일시정지" onclick="doPause()">${ICON_PAUSE}</button>` : ''}
    </div></div>`;
}
function footHtml(){
  const logs = (GRP().log || []).slice(-4).reverse().map(e => `<div>${formatLog(e)}</div>`).join('');
  return `<div class="b-foot"><div class="b-log">${logs}</div>
    <div class="b-keys"><b>Space</b>카드 뽑기<b>1</b>정답<b>2</b>오답<b>3</b>모두 모름<b>Esc</b>판정 취소<b>U</b>되돌리기<b>M</b>소리</div></div>`;
}
function render(){
  if (!game || !game.meta || game.meta.mode !== 'team') return;
  const m = META(), g = GRP();
  let body;
  if (m.status === 'lobby'){
    body = `${topHtml()}${teamsHtml()}<div class="b-stage">
      <div class="b-line">${esc(m.className)} · ${esc(m.questionSetName)}</div>
      <div class="b-sub">${m.durationMinutes}분 · 도전 규칙 ${m.challengeEnabled ? '켜짐' : '꺼짐'} · 턴 타이머 ${m.turnTimerSec ? m.turnTimerSec + '초' : '끔'}</div>
      <button class="b-draw" onclick="startFromBoard()">게임 시작</button></div>`;
  } else if (m.status === 'ended'){
    body = `${topHtml()}<div class="b-stage"><div class="b-line">게임 끝! 최종 순위</div><div class="b-sub">${endReasonText()}</div>${rankingHtml()}
      ${resultActionsHtml()}</div>`;
  } else if (g.phase === 'ended'){
    body = `${topHtml()}<div class="b-stage"><div class="b-line">게임 끝! 최종 순위</div><div class="b-sub">${endReasonText()}</div>${rankingHtml()}
      ${resultActionsHtml()}
      <div class="b-pickrow"><button class="skip" onclick="doConfirmEnd()" style="font-size:24px;padding:12px 32px;">결과 확정하고 마치기</button></div>
      <div class="b-sub">잘못 눌렀다면 되돌리기(U)로 마지막 동작을 취소할 수 있어요</div></div>`;
  } else {
    body = `${topHtml()}${teamsHtml()}<div class="b-stage">${stageHtml()}</div>${footHtml()}`;
  }
  const pause = m.status === 'paused'
    ? `<div class="pause-overlay"><div class="icon">${PAUSE_SVG}</div><h2>일시정지</h2><p>남은 시간 ${formatClock(m.remainingMsAtPause)}</p><button class="btn btn-primary" style="margin-top:18px" onclick="doResume()">다시 시작</button></div>` : '';
  app.innerHTML = `<div class="b-wrap">${body}</div>${pause}`;
  document.querySelectorAll('.b-team.current, .b-team.pickable, .hand-chip.usable').forEach(el => { el.style.animationDelay = '-' + (Date.now() % 1400) + 'ms'; });
}
const PAUSE_SVG = '<svg viewBox="0 0 96 96"><defs><linearGradient id="pauseG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FB6E4"/><stop offset="1" stop-color="#4A72A8"/></linearGradient></defs><circle cx="48" cy="48" r="44" fill="url(#pauseG)" stroke="#fff" stroke-width="4"/><rect x="31" y="28" width="12" height="40" rx="5" fill="#fff"/><rect x="53" y="28" width="12" height="40" rx="5" fill="#fff"/></svg>';

// ======================================================
// 단축키
// ======================================================
// ======================================================
// 알림(토스트): 학생 화면과 같은 방식 (로그 번호로 새 알림을 구분해요)
// ======================================================
let noticeQueue = [], noticeShowing = false, noticeStartedAt = 0;
function pushNotice(html, ms){
  noticeQueue.push({ html, ms: ms || 2200 });
  if (noticeShowing && Date.now() - noticeStartedAt > 9000) noticeShowing = false;
  if (!noticeShowing) playNextNotice();
}
function playNextNotice(){
  if (noticeQueue.length === 0){ noticeShowing = false; return; }
  noticeShowing = true; noticeStartedAt = Date.now();
  const n = noticeQueue.shift();
  document.querySelectorAll('.game-notice').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'game-notice';
  el.innerHTML = n.html;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => { el.remove(); playNextNotice(); }, 300); }, n.ms);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ noticeShowing = false; noticeQueue.length = 0; document.querySelectorAll('.game-notice').forEach(el => el.remove()); }
});
let lastLogSeen = null;
// 카드 뽑기 / 방어 / 점프·전환 결과는 더 자세한 알림이 따로 있어서 여기서는 건너뛰어요
const SKIP_LOG = /카드를 뽑았어요$|방어 카드로 .*막았어요$|건너뛰어질 예정|반대로 바뀔 예정/;
function checkLogToasts(){
  const log = GRP().log || [];
  const maxId = log.reduce((mx, e) => Math.max(mx, e.id || 0), 0);
  if (lastLogSeen === null){ lastLogSeen = maxId; return; }
  if (maxId < lastLogSeen){ lastLogSeen = maxId; return; } // 되돌리기 등으로 번호가 줄어든 경우
  const fresh = log.filter(e => (e.id || 0) > lastLogSeen);
  if (!fresh.length) return;
  lastLogSeen = maxId;
  fresh.filter(e => serverNow() - e.ts < 15000 && !SKIP_LOG.test(e.text || '')).slice(-4).forEach(e => pushNotice(formatLog(e)));
}

// ======================================================
// 결과 화면: 모두 모름 / 오답 많은 문제를 슬라이드로 (관리자 화면과 같은 기능)
// ======================================================
function qStatList(kind){
  return Object.entries(GRP().qstats || {})
    .map(([qid, s]) => ({ qid, text: s.text || '(문제 내용 없음)', count: s[kind] || 0 }))
    .filter(r => r.count > 0)
    .sort((a, b) => b.count - a.count || String(a.text).localeCompare(String(b.text), 'ko'));
}
let statSlide = null;
function openStatSlides(kind){
  const items = qStatList(kind);
  if (!items.length){ showToast('기록이 없어요'); return; }
  statSlide = { kind, items, i: 0 };
  document.addEventListener('keydown', statSlideKey);
  renderStatSlide();
}
function renderStatSlide(){
  if (!statSlide) return;
  let el = document.getElementById('statSlide');
  if (!el){ el = document.createElement('div'); el.id = 'statSlide'; el.className = 'slide-overlay'; document.body.appendChild(el); }
  const { kind, items, i } = statSlide, it = items[i];
  const title = kind === 'unknown' ? '모두 모름 문제' : '오답 많은 문제';
  el.innerHTML = `
    <div class="slide-top"><div class="ttl">${esc(META().className)} · ${title}</div>
      <div style="display:flex; gap:8px;"><button class="btn btn-small" onclick="statSlideFullscreen()">전체화면</button><button class="btn btn-small" onclick="closeStatSlide()">닫기 ✕</button></div></div>
    <div class="slide-body"><div class="slide-rank">${i + 1}위</div><div class="slide-q">${esc(it.text)}</div><div class="slide-count ${kind}">${it.count}회</div></div>
    <div class="slide-nav"><button onclick="statSlideGo(-1)" ${i === 0 ? 'disabled' : ''}>◀</button><div class="pg">${i + 1} / ${items.length}</div><button onclick="statSlideGo(1)" ${i === items.length - 1 ? 'disabled' : ''}>▶</button></div>`;
}
function statSlideGo(d){ if (!statSlide) return; statSlide.i = Math.min(statSlide.items.length - 1, Math.max(0, statSlide.i + d)); renderStatSlide(); }
function statSlideKey(e){
  if (!statSlide) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); statSlideGo(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); statSlideGo(-1); }
  else if (e.key === 'Escape') closeStatSlide();
}
function statSlideFullscreen(){
  const el = document.getElementById('statSlide');
  if (!document.fullscreenElement){ if (el && el.requestFullscreen) el.requestFullscreen(); } else document.exitFullscreen();
}
function closeStatSlide(){
  document.removeEventListener('keydown', statSlideKey);
  if (document.fullscreenElement) document.exitFullscreen();
  const el = document.getElementById('statSlide'); if (el) el.remove();
  statSlide = null;
}

function onKey(e){
  if (statSlide) return;
  if (document.querySelector('.modal-overlay')){ if (e.key === 'Escape') document.querySelectorAll('.modal-overlay').forEach(x => x.remove()); return; }
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (!game || !game.meta || game.meta.mode !== 'team' || game.meta.status !== 'playing') return;
  const c = e.code;
  if (c === 'Space'){ e.preventDefault(); doDraw(); }
  else if (c === 'Digit1' || c === 'Numpad1') doJudge('correct');
  else if (c === 'Digit2' || c === 'Numpad2') doJudge('incorrect');
  else if (c === 'Digit3' || c === 'Numpad3') doJudge('unknown');
  else if (c === 'Escape') doCancelJudge();
  else if (c === 'KeyU') doUndo();
  else if (c === 'KeyM') toggleMute();
}

// ======================================================
// 시작: 관리자 PIN 확인 → 게임 구독
// ======================================================
function onData(){
  if (!game){ app.innerHTML = msgScreen('게임을 찾을 수 없어요'); return; }
  if (!game.meta || game.meta.mode !== 'team'){ app.innerHTML = msgScreen('모둠 간 경쟁 게임이 아니에요'); return; }
  detectEvents(); checkLogToasts(); render(); scheduleWork();
}
function startBoard(){
  db.ref('games/' + gameId).on('value', snap => { game = snap.val(); onData(); });
  setInterval(() => { if (game && game.meta && game.meta.mode === 'team'){ render(); scheduleWork(); tickSounds(); } }, 1000);
  document.addEventListener('keydown', onKey);
  const unlock = () => { ac(); document.removeEventListener('click', unlock); document.removeEventListener('keydown', unlock); };
  document.addEventListener('click', unlock); document.addEventListener('keydown', unlock);
}
function renderGate(){
  app.innerHTML = `<div class="center-screen"><div class="card-box">
    <h2>칠판 화면</h2><p>관리자 PIN을 입력해 주세요</p>
    <input type="password" id="gateInput" placeholder="PIN" style="width:100%; text-align:center; font-size:20px; margin:10px 0;">
    <div id="gateErr" style="color:var(--brick); min-height:20px; font-size:14px;"></div>
    <button class="btn btn-primary" onclick="submitGate()">열기</button></div></div>`;
  const input = document.getElementById('gateInput');
  input.focus(); input.addEventListener('keydown', e => { if (e.key === 'Enter') submitGate(); });
}
async function submitGate(){
  const v = document.getElementById('gateInput').value.trim();
  const pin = await getAdminPin();
  if (v && v === pin){ sessionStorage.setItem('admin_unlocked', '1'); startBoard(); }
  else document.getElementById('gateErr').textContent = 'PIN이 맞지 않아요';
}
(async function init(){
  if (!gameId){ app.innerHTML = msgScreen('게임 주소가 올바르지 않아요'); return; }
  if (sessionStorage.getItem('admin_unlocked') === '1'){ startBoard(); return; }
  const pin = await getAdminPin();
  if (!pin){ app.innerHTML = msgScreen('먼저 관리자 화면에서 PIN을 만들어주세요'); return; }
  renderGate();
})();
</script>
