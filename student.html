<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>국어누리게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  body{ user-select:none; margin:0; }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game-logic.js"></script>
<script src="db.js"></script>
<script>

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function escapeHtml(str){
  return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}

const app = document.getElementById('app');

// ---------- 세션 상태 ----------
let session = JSON.parse(sessionStorage.getItem('cardgame_session') || 'null');
let currentClass = null;
let currentGame = null;
let roster = {};
let gameListenerRef = null;
let pendingLogin = null; // { sid, name, number } - PIN 확인 중인 임시 상태

function saveSession(){ sessionStorage.setItem('cardgame_session', JSON.stringify(session)); }
function clearSession(){ session = null; sessionStorage.removeItem('cardgame_session'); }

// ---------- 화면: 입장 코드 ----------
function renderCodeScreen(){
  app.innerHTML = `
    <div class="center-screen">
      <div class="card-box">
        <h2>📖 국어누리게임</h2>
        <p>선생님이 알려주신 학급 코드를 입력하세요</p>
        <input type="text" id="codeInput" inputmode="numeric" maxlength="4" placeholder="0000">
        <button class="btn btn-primary btn-big" style="width:100%; margin-top:14px;" onclick="submitCode()">입장</button>
        <div id="codeError" class="hint" style="color:var(--brick); margin-top:10px;"></div>
      </div>
    </div>
  `;
  document.getElementById('codeInput').focus();
  document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key==='Enter') submitCode(); });
}

async function submitCode(){
  const code = document.getElementById('codeInput').value.trim();
  if (!code){ return; }
  const cls = await findClassByCode(code);
  if (!cls){ document.getElementById('codeError').textContent = '코드를 다시 확인해주세요'; return; }
  currentClass = cls;
  const game = await findActiveGameForClass(cls.id);
  if (!game){ document.getElementById('codeError').textContent = '진행 중인 게임이 없어요. 선생님께 확인해주세요'; return; }
  session = { classId: cls.id, gameId: game.id, studentId: null };
  saveSession();
  loadRosterAndShowNames();
}

// ---------- 화면: 이름 선택 ----------
async function loadRosterAndShowNames(){
  const snap = await db.ref('rosters/' + session.classId).once('value');
  roster = snap.val() || {};
  renderNameScreen();
}

function renderNameScreen(){
  const students = Object.entries(roster).sort((a,b) => Number(a[1].number)-Number(b[1].number));
  app.innerHTML = `
    <div class="center-screen">
      <div class="card-box" style="max-width:520px;">
        <h2>내 이름을 골라주세요</h2>
        <p>${escapeHtml(currentClass.name)}</p>
        <div class="name-grid" id="nameGrid"></div>
      </div>
    </div>
  `;
  const grid = document.getElementById('nameGrid');
  db.ref(`games/${session.gameId}/players`).once('value').then(snap => {
    const players = snap.val() || {};
    grid.innerHTML = students.map(([sid,s]) => {
      const taken = players[sid] && players[sid].connected;
      return `<button class="pick-btn" ${taken?'disabled':''} onclick="startPinFlow('${sid}')">
        ${escapeHtml(s.number)}번<br>${escapeHtml(s.name)}
      </button>`;
    }).join('');
  });
}

// ---------- PIN 흐름 ----------
function startPinFlow(sid){
  const s = roster[sid];
  pendingLogin = { sid, name: s.name, number: s.number };
  if (!s.pin) renderSetPinScreen();
  else renderEnterPinScreen(s.pin);
}

let pinBuffer = '';
let pinFirstEntry = null;

function pinPadHtml(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  return `<div class="pin-pad">${keys.map(k => k==='' ? '<div></div>' : `<button onclick="pinKeyPress('${k}')">${k}</button>`).join('')}</div>`;
}

function renderSetPinScreen(){
  pinBuffer = ''; pinFirstEntry = null;
  app.innerHTML = `
    <div class="center-screen">
      <div class="card-box" style="max-width:400px;">
        <h2>PIN 만들기</h2>
        <p id="pinScreenDesc">앞으로 쓸 4자리 PIN을 정해주세요</p>
        <div class="pin-dots" id="pinDots">${'<span class="dot"></span>'.repeat(4)}</div>
        ${pinPadHtml()}
      </div>
    </div>
  `;
}

function renderEnterPinScreen(realPin){
  pinBuffer = '';
  app.innerHTML = `
    <div class="center-screen">
      <div class="card-box" style="max-width:400px;">
        <h2>PIN 입력</h2>
        <p id="pinScreenDesc">${escapeHtml(pendingLogin.name)}님, PIN을 입력하세요</p>
        <div class="pin-dots" id="pinDots">${'<span class="dot"></span>'.repeat(4)}</div>
        ${pinPadHtml()}
      </div>
    </div>
  `;
  window._checkPin = realPin;
}

function updatePinDots(){
  const dots = document.querySelectorAll('#pinDots .dot');
  dots.forEach((d,i) => d.classList.toggle('filled', i < pinBuffer.length));
}

async function pinKeyPress(k){
  if (k === '⌫'){ pinBuffer = pinBuffer.slice(0,-1); updatePinDots(); return; }
  if (pinBuffer.length >= 4) return;
  pinBuffer += k;
  updatePinDots();
  if (pinBuffer.length === 4){
    await new Promise(r => setTimeout(r, 150));
    if (window._checkPin !== undefined){
      // PIN 입력(로그인) 모드
      if (pinBuffer === window._checkPin){
        finalizeLogin();
      } else {
        showToast('PIN이 맞지 않아요');
        pinBuffer = ''; updatePinDots();
      }
    } else {
      // PIN 설정 모드
      if (pinFirstEntry === null){
        pinFirstEntry = pinBuffer;
        pinBuffer = '';
        document.getElementById('pinScreenDesc').textContent = '한 번 더 입력해주세요';
        updatePinDots();
      } else {
        if (pinBuffer === pinFirstEntry){
          await setStudentPin(session.classId, pendingLogin.sid, pinBuffer);
          finalizeLogin();
        } else {
          showToast('입력한 PIN이 서로 달라요. 다시 정해주세요');
          pinFirstEntry = null; pinBuffer = '';
          document.getElementById('pinScreenDesc').textContent = '앞으로 쓸 4자리 PIN을 정해주세요';
          updatePinDots();
        }
      }
    }
  }
}

async function finalizeLogin(){
  delete window._checkPin;
  session.studentId = pendingLogin.sid;
  saveSession();
  await joinPlayer(session.gameId, pendingLogin.sid, { name: pendingLogin.name, number: pendingLogin.number });
  attachGameListener();
}

// ---------- 실시간 게임 리스너 ----------
function attachGameListener(){
  if (gameListenerRef) gameListenerRef.off();
  gameListenerRef = db.ref(`games/${session.gameId}`);
  gameListenerRef.on('value', snap => {
    currentGame = snap.val();
    if (!currentGame){ showToast('게임을 찾을 수 없어요'); clearSession(); renderCodeScreen(); return; }
    route();
  });
}

async function tryResume(){
  if (!session || !session.gameId){ renderCodeScreen(); return; }
  const snap = await db.ref(`games/${session.gameId}`).once('value');
  const game = snap.val();
  if (!game){ clearSession(); renderCodeScreen(); return; }
  const clsSnap = await db.ref('classes/' + session.classId).once('value');
  currentClass = { id: session.classId, ...(clsSnap.val()||{}) };
  if (!session.studentId){
    await loadRosterAndShowNames();
    return;
  }
  const rSnap = await db.ref('rosters/' + session.classId).once('value');
  roster = rSnap.val() || {};
  await setPlayerConnected(session.gameId, session.studentId, true);
  attachGameListener();
}

// ---------- 라우팅 ----------
function route(){
  const g = currentGame;
  const myId = session.studentId;
  const meta = g.meta;
  const players = g.players || {};
  const me = players[myId];

  if (!me){ renderNameScreen(); return; }

  let myGroupIndex = me.groupIndex;
  const groups = g.groups || {};

  if (!myGroupIndex){
    if (meta.status === 'lobby'){ renderGroupPick(g); return; }
    else { app.innerHTML = '<div class="center-screen"><div class="card-box"><h2>모둠 배정을 기다리는 중이에요</h2><p>선생님께 문의해주세요</p></div></div>'; return; }
  }

  const grp = groups[myGroupIndex];
  if (!grp){ app.innerHTML = '<div class="center-screen"><div class="card-box"><h2>모둠 정보를 불러올 수 없어요</h2></div></div>'; return; }

  const mySeat = Object.entries(grp.seats||{}).find(([seat,pid]) => pid === myId);

  if (meta.status === 'lobby'){
    if (!mySeat) renderSeatPick(g, myGroupIndex, grp);
    else renderWaitingRoom(g, myGroupIndex, grp);
    return;
  }

  checkGroupLog(myGroupIndex, grp, players);

  if (grp.phase === 'ended' || meta.status === 'ended'){
    renderResults(g, myGroupIndex, grp);
    return;
  }

  renderGameScreen(g, myGroupIndex, grp);
}

// ---------- 화면: 모둠 선택 ----------
function renderGroupPick(g){
  const groups = g.groups || {};
  app.innerHTML = `
    <div class="center-screen">
      <div class="card-box" style="max-width:480px;">
        <h2>모둠을 선택하세요</h2>
        <p>선생님이 안내한 모둠 번호를 눌러주세요</p>
        <div class="group-grid">
          ${Object.keys(groups).sort((a,b)=>a-b).map(gi => {
            const seatCount = Object.keys(groups[gi].seats||{}).length;
            const full = seatCount >= g.meta.maxPerGroup;
            return `<button class="pick-btn" ${full?'disabled':''} onclick="pickGroup(${gi})">${gi}조<br><span style="font-size:11px;font-weight:400;">${seatCount}/${g.meta.maxPerGroup}명</span></button>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

async function pickGroup(gi){
  await setPlayerGroup(session.gameId, session.studentId, gi);
}

// ---------- 화면: 자리 선택 ----------
function renderSeatPick(g, gi, grp){
  const seats = grp.seats || {};
  const players = g.players || {};
  app.innerHTML = `
    <div class="center-screen">
      <div class="card-box" style="max-width:480px;">
        <h2>자리를 골라주세요</h2>
        <p>가위바위보 승자가 1번, 이후 시계 방향으로 골라요</p>
        <div class="seat-grid">
          ${Array.from({length: g.meta.maxPerGroup}, (_,i) => i+1).map(seat => {
            const takenBy = seats[seat];
            const takenByMe = takenBy === session.studentId;
            return `<button class="pick-btn ${takenByMe?'mine':''}" ${takenBy && !takenByMe ? 'disabled':''} onclick="pickSeatUI(${gi},${seat})">
              ${seat}번${takenBy ? '<br><span style="font-size:11px;font-weight:400;">'+escapeHtml(players[takenBy]?.name||'')+'</span>' : ''}
            </button>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

async function pickSeatUI(gi, seat){
  const res = await pickSeat(session.gameId, gi, seat, session.studentId);
  if (!res.committed) showToast('이미 선택된 자리예요');
}

// ---------- 화면: 대기실 ----------
function renderWaitingRoom(g, gi, grp){
  const players = g.players || {};
  const seats = grp.seats || {};
  app.innerHTML = `
    <div class="center-screen">
      <div class="card-box" style="max-width:480px;">
        <h2>🎴 시작을 기다리는 중</h2>
        <p>${gi}조</p>
        <div class="seat-ring">
          ${Object.entries(seats).sort((a,b)=>a[0]-b[0]).map(([seat,pid]) => `
            <div class="seat-chip ${pid===session.studentId?'me':''}">
              <div class="nm">${escapeHtml(players[pid]?.name||'?')}</div>
              <div class="cnt">${seat}번</div>
            </div>
          `).join('')}
        </div>
        <p class="hint">선생님이 게임을 시작하면 자동으로 화면이 바뀌어요</p>
      </div>
    </div>
  `;
}

// ---------- 게임 진행 알림 (토스트) ----------
let lastLogSeen = {};
function formatLogText(entry, players){
  if (!entry.playerId) return entry.text;
  const name = (players[entry.playerId] && players[entry.playerId].name) || '???';
  return entry.text.replace('{name}', name);
}
function checkGroupLog(gi, grp, players){
  const key = session.gameId + '_' + gi;
  const log = grp.log || [];
  if (!(key in lastLogSeen)){ lastLogSeen[key] = log.length; return; }
  if (log.length > lastLogSeen[key]){
    for (let i = lastLogSeen[key]; i < log.length; i++) pushNotice(formatLogText(log[i], players));
    lastLogSeen[key] = log.length;
  }
}
let noticeQueue = [];
let noticeShowing = false;
function pushNotice(text){
  noticeQueue.push(text);
  if (!noticeShowing) playNextNotice();
}
function playNextNotice(){
  if (noticeQueue.length === 0){ noticeShowing = false; return; }
  noticeShowing = true;
  const text = noticeQueue.shift();
  // 매번 새 엘리먼트를 만들어서, 이전 알림 상태가 남아 안 사라지는 문제를 없애요.
  document.querySelectorAll('.game-notice').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'game-notice';
  el.textContent = text;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => { el.remove(); playNextNotice(); }, 300);
  }, 2200);
}

// ---------- 화면: 게임 플레이 ----------
let scheduledDeadlines = {};
function scheduleOnce(key, deadline, fn){
  if (scheduledDeadlines[key]) return;
  const wait = Math.max(0, deadline - serverNow());
  scheduledDeadlines[key] = setTimeout(() => { delete scheduledDeadlines[key]; fn(); }, wait + 150);
}

let lastCardKey = null;
let pickedFanIndex = null;
let lastFanDeadline = null;

function renderGameScreen(g, gi, grp){
  const meta = g.meta;
  const players = g.players || {};
  const myId = session.studentId;

  if (meta.status === 'paused'){
    app.innerHTML = `
      <div class="pause-overlay">
        <div class="icon">⏸️</div>
        <h2>선생님이 게임을 잠시 멈췄어요</h2>
        <p>남은 시간 ${formatClock(meta.remainingMsAtPause)} · 곧 다시 시작해요</p>
      </div>
    `;
    return;
  }

  const order = computeOrder(grp.seats||{}, grp.excludedIds||{});
  const isMyTurn = grp.currentPlayerId === myId;
  const isJudge = grp.judgeId === myId;
  const myHand = (grp.hands && grp.hands[myId]) || emptyHand();

  if (meta.endAt) endGroupIfTimeUp(session.gameId, gi, meta.endAt);
  const remaining = meta.endAt ? meta.endAt - serverNow() : null;

  const showReveal = grp.lastEffect && (Date.now() - grp.lastEffect.ts < 2600);

  // 모둠원 중 누구의 화면이 켜져 있든 제때 결과가 반영되도록, 역할과 무관하게 전원이 예약해요.
  if (grp.phase === 'awaiting_defense' && grp.defenseWindow){
    scheduleOnce('defense_'+gi+'_'+grp.defenseWindow.deadline, grp.defenseWindow.deadline, () => resolveDefenseWindow(session.gameId, gi));
  }
  if (grp.phase === 'judge_pending' && grp.pendingJudge){
    scheduleOnce('judge_'+gi+'_'+grp.pendingJudge.deadline, grp.pendingJudge.deadline, () => resolveJudge(session.gameId, gi));
  }

  app.innerHTML = `
    <div class="felt-bg">
      <div class="game-top">
        <div class="timer">${formatClock(remaining)}</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="chip">${gi}조</span>
          <button class="btn btn-ghost btn-small" onclick="showHelpModal()">카드 설명</button>
        </div>
      </div>
      ${remaining != null && remaining <= 60000 && remaining > 0 ? '<div class="last-turn-banner">⏰ 곧 시간이 끝나요</div>' : ''}

      <div class="game-wrap">
        <div class="seat-ring">
          ${order.map(pid => {
            const p = players[pid];
            const h = (grp.hands && grp.hands[pid]) || emptyHand();
            const total = handTotal(h);
            const badges = [];
            if (grp.judgeId === pid) badges.push('<span class="badge judge">판정자</span>');
            const cls = [
              pid===myId ? 'me' : '',
              grp.currentPlayerId === pid ? 'active-turn' : ''
            ].join(' ');
            return `<div class="seat-chip ${cls}">
              <div class="nm">${escapeHtml(p?.name||'?')}</div>
              <div class="card-stack">${total>0 ? '<div class="cs"></div><div class="cs"></div><div class="cs"></div><div class="num">'+total+'</div>' : '<span class="hint">0</span>'}</div>
              <div class="badges">${badges.join('')}</div>
            </div>`;
          }).join('')}
        </div>

        <div style="text-align:center; margin-bottom:10px;">
          <span class="direction-arrow">${(grp.direction||1) === 1 ? '↻ 시계 방향' : '↺ 반시계 방향'}</span>
        </div>

        ${grp.phase === 'pre_turn' && !showReveal ? `
          <div class="deck-pile ${isMyTurn?'tappable':''}" id="deckPile" ${isMyTurn ? 'onclick="handleDraw()"' : ''}><div class="card-back"></div><div class="card-back"></div><div class="card-back"></div></div>
          ${isMyTurn ? '<div class="deck-hint">덱을 톡 눌러서 카드를 뽑아요 👆</div>' : ''}
        ` : ''}
        ${renderCenter(g, gi, grp, myId, isMyTurn, isJudge, showReveal)}

        <div class="hand-section-title"><span class="pill-label score-pill">⭐ 점수 카드</span></div>
        <div class="hand-row">
          ${SCORE_TYPES.map(t => handChipHtml(t, myHand[t]||0, true)).join('')}
        </div>
        <div class="hand-section-title"><span class="pill-label">🎒 특수 카드</span></div>
        <div class="hand-row">
          ${HAND_TYPES.map(t => handChipHtml(t, myHand[t]||0, false)).join('')}
        </div>

        ${renderActionArea(g, gi, grp, myId, isMyTurn, isJudge)}
      </div>

      ${renderDefenseModal(g, gi, grp, myId)}
    </div>
  `;
}

function handChipHtml(t, n, isScore){
  const click = isScore ? ` onclick="showSolvedModal('${t}')"` : '';
  return `<div class="hand-chip t-${t} ${isScore?'score clickable':''} ${n>0?'':'zero'}"${click}>
    <div class="n">${n}</div>
    <div class="ico">${cardIcon(t,30)}</div>
    <div class="lb">${CARD_LABELS[t]}</div>
  </div>`;
}

function renderCenter(g, gi, grp, myId, isMyTurn, isJudge, showReveal){
  if (showReveal) return renderEffectReveal(grp.lastEffect);

  if (grp.phase === 'awaiting_defense' && grp.defenseWindow && grp.defenseWindow.effect === 'steal' && grp.defenseWindow.actorId === myId){
    return renderStealFan(grp);
  }

  if (grp.phase === 'pre_turn'){
    if (isMyTurn) return `<div class="center-card"><div class="qtext">내 차례예요</div><div class="hint">카드를 뽑거나, 손에 있는 점프/전환 카드를 먼저 쓸 수 있어요</div></div>`;
    const name = escapeHtml((g.players[grp.currentPlayerId]||{}).name || '?');
    return `<div class="center-card"><div class="qtext">${name}님의 차례를 기다리는 중</div></div>`;
  }
  if (grp.phase === 'awaiting_answer' || grp.phase === 'judge_pending'){
    const card = grp.currentCard;
    const key = card.questionId + card.type + grp.turnNumber;
    const anim = (key !== lastCardKey) ? 'flip-in' : '';
    lastCardKey = key;
    return `<div class="center-card is-question t-${card.type} ${anim}">
      <span class="type-tag">${cardIcon(card.type,20)} ${CARD_LABELS[card.type]}</span>
      <div class="qpaper"><span class="qbadge">Q</span><div class="qtext">${escapeHtml(card.text)}</div></div>
    </div>`;
  }
  if (grp.phase === 'steal_pick'){
    if (isMyTurn) return renderTargetPicker(g, gi, grp, myId);
    return `<div class="center-card"><div class="qtext">강탈 대상을 고르는 중이에요</div></div>`;
  }
  if (grp.phase === 'awaiting_defense'){
    return `<div class="center-card"><div class="qtext">카드 효과가 발동됐어요</div></div>`;
  }
  return '<div class="center-card"><div class="qtext">덱이 모두 소진됐어요</div></div>';
}

function renderTargetPicker(g, gi, grp, myId){
  const order = computeOrder(grp.seats, grp.excludedIds);
  const targets = order.filter(id => id !== myId && handTotal(grp.hands[id]) > 0);
  return `<div class="target-picker">
    <div class="label">🎭 누구의 카드를 뺏을까요?</div>
    <div class="target-grid">
      ${targets.map(id => `
        <div class="target-card" onclick="handleStealTarget('${id}')">
          ${escapeHtml((g.players[id]||{}).name||'?')}<br>
          <span style="font-size:11px; font-weight:600;">카드 ${handTotal(grp.hands[id])}장</span>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderEffectReveal(eff){
  const iconType = eff.effect==='steal' ? (eff.success ? (eff.cardType||'steal') : 'defense')
                  : eff.effect==='jump' ? (eff.success ? 'jump' : 'defense')
                  : (eff.success ? 'turn' : 'defense');
  const bg = (eff.effect==='steal' && eff.success && eff.cardType) ? CARD_COLORS[eff.cardType]
           : (eff.success ? CARD_COLORS.jump : CARD_COLORS.defense);
  const label = eff.effect==='steal' ? (eff.success ? '카드 강탈 성공!' : '방어 성공! 강탈을 막았어요')
              : eff.effect==='jump' ? (eff.success ? '다음 사람 턴 건너뛰기!' : '방어 성공! 점프를 막았어요')
              : (eff.success ? '진행 방향이 바뀌었어요!' : '방어 성공! 전환을 막았어요');
  return `<div class="center-card">
    <div class="steal-reveal-card" style="background:${bg};">${cardIcon(iconType,44)}</div>
    <div class="qtext">${label}</div>
  </div>`;
}

function renderStealFan(grp){
  const dw = grp.defenseWindow;
  if (lastFanDeadline !== dw.deadline){ lastFanDeadline = dw.deadline; pickedFanIndex = null; }
  const targetId = dw.targetIds[0];
  const count = Math.min(8, Math.max(1, handTotal(grp.hands[targetId])));
  const remain = Math.max(0, Math.round((dw.deadline - serverNow())/1000));
  return `<div class="center-card">
    <div class="hint">${pickedFanIndex===null ? '뒷면 카드 중 하나를 골라보세요' : `결과를 기다리는 중... ${remain}초`}</div>
    <div class="steal-fan">
      ${Array.from({length:count},(_,i)=>`<div class="card-back ${pickedFanIndex===i?'picked':''}" onclick="pickFanCard(${i})"></div>`).join('')}
    </div>
  </div>`;
}
function pickFanCard(i){ pickedFanIndex = i; route(); }

function renderActionArea(g, gi, grp, myId, isMyTurn, isJudge){
  let html = '<div class="action-row">';

  if (grp.phase === 'pre_turn' && isMyTurn){
    const hand = grp.hands[myId] || emptyHand();
    if (hand.jump > 0) html += `<button class="btn btn-ghost" onclick="handleSpecial('jump')">${cardIcon('jump')} 점프 사용</button>`;
    if (hand.turn > 0) html += `<button class="btn btn-ghost" onclick="handleSpecial('turn')">${cardIcon('turn')} 전환 사용</button>`;
  }

  if (grp.phase === 'awaiting_answer'){
    if (isMyTurn){
      const hand = grp.hands[myId] || emptyHand();
      if (hand.pass > 0 && !(grp.turnFlags && grp.turnFlags.passUsed)){
        html += `<button class="btn btn-ghost" onclick="handlePass()">${cardIcon('pass')} 패스 사용</button>`;
      }
    }
    if (isJudge){
      html += `</div><div class="action-row judge-row">
        <button class="btn btn-correct" onclick="handleJudge('correct')">정답</button>
        <button class="btn btn-incorrect" onclick="handleJudge('incorrect')">오답</button>
        <button class="btn btn-unknown" onclick="handleJudge('unknown')">모두 모름</button>
      </div><div class="action-row">`;
    }
  }

  if (grp.phase === 'judge_pending' && isJudge){
    const remain = Math.max(0, Math.round((grp.pendingJudge.deadline - serverNow())/1000));
    html += `<button class="btn btn-danger" onclick="handleCancelJudge()">판정 취소 (${remain}초)</button>`;
  }

  html += '</div>';
  return html;
}

function renderDefenseModal(g, gi, grp, myId){
  const dw = grp.defenseWindow;
  if (!dw || !dw.targetIds.includes(myId)) return '';
  const already = dw.responses && dw.responses[myId] !== undefined;
  const remain = Math.max(0, Math.round((dw.deadline - serverNow())/1000));

  const effectLabel = { steal:'강탈', jump:'점프', turn:'전환' }[dw.effect] || dw.effect;
  const myHand = grp.hands[myId] || emptyHand();
  return `
    <div class="modal-overlay">
      <div class="modal-box">
        <h2>${effectLabel} 효과가 발동됐어요</h2>
        <div class="countdown-ring">${remain}초</div>
        ${already
          ? '<p class="hint">응답했어요. 결과를 기다리는 중...</p>'
          : `<div style="display:flex; gap:10px; justify-content:center;">
              <button class="btn btn-primary" ${myHand.defense<=0?'disabled':''} onclick="handleDefenseRespond(true)">방어 카드 사용</button>
              <button class="btn btn-ghost" onclick="handleDefenseRespond(false)">사용 안 함</button>
            </div>`
        }
      </div>
    </div>
  `;
}

function showSolvedModal(type){
  const gi = curGi();
  const grp = currentGame.groups[gi];
  const list = ((grp.solved || {})[session.studentId] || []).filter(s => s.type === type).slice().reverse();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:420px;">
    <h2>${cardIcon(type,26)} 내가 맞춘 문제</h2>
    <div class="solved-list">
      ${list.length ? list.map(s => `<div class="item">${escapeHtml(s.text)}</div>`).join('') : '<div class="hint">아직 맞춘 문제가 없어요</div>'}
    </div>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="this.closest('.modal-overlay').remove()">닫기</button>
  </div>`;
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function showHelpModal(){
  const rows = Object.keys(CARD_LABELS).map(t => `<div style="text-align:left; padding:8px 0; border-bottom:1px dashed var(--line);"><strong>${cardIcon(t)} ${CARD_LABELS[t]}</strong><div class="hint">${cardHelpText(t)}</div></div>`).join('');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:420px;">
    <h2>카드 설명</h2>
    <div style="max-height:50vh; overflow-y:auto;">${rows}</div>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="this.closest('.modal-overlay').remove()">닫기</button>
  </div>`;
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function cardHelpText(t){
  return {
    general: '뽑으면 문제가 공개돼요. 정답이면 획득하고, 오답이면 덱 맨 아래로, 모두 모르면 제외돼요.',
    steal: '문제를 풀고 정답이면 획득 + 다른 학생의 카드를 한 장 뺏어요.',
    silence: '뽑으면 자동으로 이번 턴을 쉬어요.',
    pass: '문제를 답하기 전에 사용하면 그 문제를 포기하고 새 카드를 뽑아요.',
    jump: '내 턴에 사용하면 다음 사람의 턴이 건너뛰어져요.',
    turn: '내 턴에 사용하면 진행 방향이 반대로 바뀌어요.',
    defense: '다른 학생의 강탈·점프·전환 효과를 막을 수 있어요.'
  }[t] || '';
}

// ---------- 액션 핸들러 ----------
function curGi(){ return (currentGame.players[session.studentId]||{}).groupIndex; }
function handleDraw(){
  const pile = document.getElementById('deckPile');
  if (pile) pile.classList.add('drawing');
  setTimeout(() => drawCard(session.gameId, curGi(), session.studentId), 180);
}
function handlePass(){ usePassCard(session.gameId, curGi(), session.studentId); }
function handleSpecial(type){ useSpecialCard(session.gameId, curGi(), session.studentId, type); }
function handleJudge(result){ proposeJudge(session.gameId, curGi(), session.studentId, result); }
function handleCancelJudge(){ cancelJudge(session.gameId, curGi(), session.studentId); }
function handleStealTarget(targetId){ chooseStealTarget(session.gameId, curGi(), session.studentId, targetId); }
function handleDefenseRespond(use){ respondDefense(session.gameId, curGi(), session.studentId, use); }

// ---------- 화면: 결과 ----------
function renderResults(g, gi, grp){
  const players = g.players || {};
  const hands = grp.hands || {};
  const rows = Object.entries(hands).map(([pid,h]) => ({ pid, name: players[pid]?.name||'?', score: handScore(h) }))
    .sort((a,b) => b.score - a.score);
  let rank=0, prevScore=null, shown=[];
  rows.forEach((r,i) => { if (r.score !== prevScore){ rank=i+1; prevScore=r.score; } shown.push({...r, rank}); });

  app.innerHTML = `
    <div class="center-screen">
      <div class="card-box" style="max-width:480px;">
        <h2>🏁 게임 종료</h2>
        <p>${gi}조 결과</p>
        <table class="results-table">
          <thead><tr><th>순위</th><th>이름</th><th>점수</th></tr></thead>
          <tbody>
            ${shown.map(r => `<tr class="${r.rank===1?'rank-1':''}"><td>${r.rank}${r.rank===1?' 🏆':''}</td><td>${escapeHtml(r.name)}${r.pid===session.studentId?' (나)':''}</td><td>${r.score}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ---------- 1초마다 화면 갱신 ----------
setInterval(() => { if (currentGame) route(); }, 1000);

tryResume();
</script>
