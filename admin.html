<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국어누리게임 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="admin">

<div class="pin-gate-overlay" id="pinGate">
  <div class="card-box" style="max-width:360px;">
    <h2 id="pinGateTitle">PIN 확인 중...</h2>
    <p id="pinGateDesc"></p>
    <input type="text" id="pinGateInput" inputmode="numeric" maxlength="6" placeholder="PIN" style="letter-spacing:0.2em; text-align:center; font-size:20px;">
    <button class="btn btn-primary btn-big" style="width:100%; margin-top:12px;" onclick="submitPinGate()">확인</button>
    <div id="pinGateError" class="hint" style="color:var(--brick); margin-top:8px;"></div>
  </div>
</div>

<header>
  <h1>📖 국어누리게임 <span style="font-weight:500; color:var(--ink-soft); font-size:16px;">관리자</span></h1>
  <p>학급 · 문제 세트 · 게임 진행을 관리해요</p>
  <button class="btn btn-ghost btn-small" style="margin-left:auto;" onclick="changeAdminPin()">PIN 변경</button>
</header>

<nav class="tabs">
  <button class="active" data-view="classesView" onclick="switchTab('classesView', this)">학급 관리</button>
  <button data-view="questionsView" onclick="switchTab('questionsView', this)">문제 세트</button>
  <button data-view="gamesView" onclick="switchTab('gamesView', this)">게임 진행</button>
</nav>

<main>

  <!-- ============ 학급 관리 ============ -->
  <div class="view active" id="classesView">
    <div class="split">
      <div class="panel">
        <h2>학급 목록</h2>
        <div id="classList"><div class="empty-msg">불러오는 중...</div></div>
        <div class="inline-form">
          <input type="text" id="newClassName" placeholder="예: 2학년 3반">
          <button class="btn btn-primary" onclick="addClass()">추가</button>
        </div>
      </div>
      <div class="panel" id="classDetail">
        <div class="empty-msg">왼쪽에서 학급을 선택하거나 새로 추가하세요.</div>
      </div>
    </div>
  </div>

  <!-- ============ 문제 세트 ============ -->
  <div class="view" id="questionsView">
    <div class="split">
      <div class="panel">
        <h2>문제 세트 목록</h2>
        <div id="setList"><div class="empty-msg">불러오는 중...</div></div>
        <div class="inline-form">
          <input type="text" id="newSetName" placeholder="예: 3단원 문법">
          <button class="btn btn-primary" onclick="addQuestionSet()">추가</button>
        </div>
      </div>
      <div class="panel" id="setDetail">
        <div class="empty-msg">왼쪽에서 문제 세트를 선택하거나 새로 추가하세요.</div>
      </div>
    </div>
  </div>

  <!-- ============ 게임 진행 ============ -->
  <div class="view" id="gamesView">
    <div class="split">
      <div class="panel">
        <h2>게임 목록</h2>
        <div id="gameList"><div class="empty-msg">불러오는 중...</div></div>
        <button class="btn btn-primary" style="margin-top:12px; width:100%;" onclick="openCreateForm()">+ 새 게임 만들기</button>
      </div>
      <div class="panel" id="gameDetail">
        <div class="empty-msg">왼쪽에서 게임을 선택하거나 새로 만드세요.</div>
      </div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game-logic.js"></script>
<script src="db.js"></script>
<script>

// ======================================================
// 공통 유틸
// ======================================================

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function switchTab(viewId, btn){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(viewId).classList.add('active');
}

function escapeHtml(str){
  return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}

async function readFileSmart(file){
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) {
    try { return new TextDecoder('euc-kr').decode(buf); }
    catch (e2) { return new TextDecoder('utf-8').decode(buf); }
  }
}

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field=''; }
      else if (c === '\r') {}
      else if (c === '\n') { row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if (field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===''));
}

function downloadTextFile(filename, text, withBom){
  const blob = new Blob([withBom ? '\uFEFF' + text : text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function randomCode(){ return String(Math.floor(1000 + Math.random() * 9000)); }

// ======================================================
// 관리자 PIN 게이트
// ======================================================

let adminPinMode = 'check'; // 'create' | 'check'

async function initPinGate(){
  if (sessionStorage.getItem('admin_unlocked') === '1'){
    document.getElementById('pinGate').style.display = 'none';
    return;
  }
  const pin = await getAdminPin();
  const gate = document.getElementById('pinGate');
  if (!pin){
    adminPinMode = 'create';
    document.getElementById('pinGateTitle').textContent = '관리자 PIN 만들기';
    document.getElementById('pinGateDesc').textContent = '처음 사용하시네요. 앞으로 쓸 PIN을 정해주세요 (4자리 이상)';
  } else {
    adminPinMode = 'check';
    document.getElementById('pinGateTitle').textContent = '관리자 PIN 입력';
    document.getElementById('pinGateDesc').textContent = '학생들이 들어올 수 없도록 잠겨 있어요';
  }
  gate.style.display = 'flex';
  document.getElementById('pinGateInput').focus();
}

async function submitPinGate(){
  const val = document.getElementById('pinGateInput').value.trim();
  if (!val){ return; }
  if (adminPinMode === 'create'){
    if (val.length < 4){ document.getElementById('pinGateError').textContent = '4자리 이상으로 정해주세요'; return; }
    await setAdminPin(val);
    sessionStorage.setItem('admin_unlocked', '1');
    document.getElementById('pinGate').style.display = 'none';
  } else {
    const pin = await getAdminPin();
    if (val === pin){
      sessionStorage.setItem('admin_unlocked', '1');
      document.getElementById('pinGate').style.display = 'none';
    } else {
      document.getElementById('pinGateError').textContent = 'PIN이 맞지 않아요';
    }
  }
}
document.getElementById('pinGateInput').addEventListener('keydown', e => { if (e.key==='Enter') submitPinGate(); });
initPinGate();

async function changeAdminPin(){
  const cur = await getAdminPin();
  const oldVal = prompt('현재 PIN을 입력하세요');
  if (oldVal !== cur){ showToast('현재 PIN이 맞지 않아요'); return; }
  const newVal = prompt('새 PIN을 입력하세요 (4자리 이상)');
  if (!newVal || newVal.length < 4){ showToast('4자리 이상으로 정해주세요'); return; }
  await setAdminPin(newVal);
  showToast('PIN을 변경했어요');
}

// ======================================================
// 학급 관리
// ======================================================

let classes = {};
let rosters = {};
let selectedClassId = null;
let pendingRosterRows = null;

db.ref('classes').on('value', snap => {
  classes = snap.val() || {};
  renderClassList();
  if (selectedClassId) renderClassDetail();
  renderCreateFormClassOptions();
});

function renderClassList(){
  const el = document.getElementById('classList');
  const ids = Object.keys(classes);
  if (ids.length === 0){ el.innerHTML = '<div class="empty-msg">등록된 학급이 없어요.</div>'; return; }
  el.innerHTML = ids.map(id => {
    const c = classes[id];
    const sel = id === selectedClassId ? 'selected' : '';
    return `<div class="list-item ${sel}" onclick="selectClass('${id}')">
      <div><div class="name">${escapeHtml(c.name)}</div><div class="sub">코드 ${c.code}</div></div>
    </div>`;
  }).join('');
}

function addClass(){
  const input = document.getElementById('newClassName');
  const name = input.value.trim();
  if (!name){ showToast('학급 이름을 입력해주세요'); return; }
  const existingCodes = Object.values(classes).map(c => c.code);
  let code; do { code = randomCode(); } while (existingCodes.includes(code));
  const ref = db.ref('classes').push();
  ref.set({ name, code, createdAt: Date.now() }).then(() => {
    input.value = ''; showToast('학급을 추가했어요'); selectedClassId = ref.key;
  });
}

function selectClass(id){
  selectedClassId = id; renderClassList(); listenRoster(id); renderClassDetail();
}

function listenRoster(classId){
  db.ref('rosters/' + classId).off();
  db.ref('rosters/' + classId).on('value', snap => {
    rosters[classId] = snap.val() || {};
    if (selectedClassId === classId) renderClassDetail();
  });
}

function renderClassDetail(){
  const c = classes[selectedClassId];
  const el = document.getElementById('classDetail');
  if (!c){ el.innerHTML = '<div class="empty-msg">왼쪽에서 학급을 선택하거나 새로 추가하세요.</div>'; return; }
  const roster = rosters[selectedClassId] || {};
  const students = Object.entries(roster).sort((a,b) => Number(a[1].number) - Number(b[1].number));

  el.innerHTML = `
    <div class="detail-header">
      <div><div class="detail-title">${escapeHtml(c.name)}</div><div class="hint">학생들이 이 코드로 입장해요</div></div>
      <div class="code-card"><div><div class="label">입장 코드</div><div class="code">${c.code}</div></div></div>
    </div>
    <div class="section">
      <div class="section-title">명단 (${students.length}명)</div>
      <table>
        <thead><tr><th style="width:70px">번호</th><th>이름</th><th style="width:90px">PIN</th><th style="width:150px"></th></tr></thead>
        <tbody>
          ${students.map(([sid, s]) => `
            <tr><td>${escapeHtml(s.number)}</td><td>${escapeHtml(s.name)}</td>
            <td>${s.pin ? escapeHtml(s.pin) : '<span class="hint">미설정</span>'}</td>
            <td class="row-actions">
              ${s.pin ? `<button class="btn btn-ghost btn-small" onclick="handleResetPin('${sid}')">PIN 초기화</button>` : ''}
              <button class="btn btn-danger btn-small" onclick="deleteStudent('${sid}')">삭제</button>
            </td></tr>
          `).join('') || '<tr><td colspan="4" class="empty-msg">등록된 학생이 없어요.</td></tr>'}
        </tbody>
      </table>
      <div class="inline-form">
        <input type="number" id="newStudentNumber" placeholder="번호" style="max-width:90px;">
        <input type="text" id="newStudentName" placeholder="이름">
        <button class="btn btn-primary" onclick="addStudent()">추가</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">명단 CSV로 올리기</div>
      <div class="upload-box">
        <div class="hint">번호, 이름 두 열로 된 CSV 파일. 첫 줄이 제목이면 자동으로 건너뛰어요.</div>
        <div style="margin-top:10px;"><input type="file" id="rosterFile" accept=".csv" onchange="handleRosterFile(this.files[0])"></div>
        <div id="rosterPreviewArea"></div>
      </div>
    </div>
    <div class="section"><button class="btn btn-danger" onclick="deleteClass('${selectedClassId}')">이 학급 삭제</button></div>
  `;
}

function addStudent(){
  const numEl = document.getElementById('newStudentNumber');
  const nameEl = document.getElementById('newStudentName');
  const number = numEl.value.trim(), name = nameEl.value.trim();
  if (!number || !name){ showToast('번호와 이름을 모두 입력해주세요'); return; }
  db.ref('rosters/' + selectedClassId).push({ number, name }).then(() => {
    numEl.value=''; nameEl.value=''; showToast('학생을 추가했어요');
  });
}

function handleResetPin(studentId){
  if (!confirm('이 학생의 PIN을 초기화할까요? 다음 로그인 때 새로 설정하게 돼요.')) return;
  resetStudentPin(selectedClassId, studentId).then(() => showToast('PIN을 초기화했어요'));
}

function deleteStudent(studentId){
  if (!confirm('이 학생을 명단에서 삭제할까요?')) return;
  db.ref('rosters/' + selectedClassId + '/' + studentId).remove();
}

function deleteClass(classId){
  const name = classes[classId]?.name || '';
  if (!confirm(`"${name}" 학급을 삭제할까요?\n명단도 함께 삭제되며 되돌릴 수 없어요.`)) return;
  db.ref('classes/' + classId).remove();
  db.ref('rosters/' + classId).remove();
  selectedClassId = null;
  document.getElementById('classDetail').innerHTML = '<div class="empty-msg">왼쪽에서 학급을 선택하거나 새로 추가하세요.</div>';
}

async function handleRosterFile(file){
  if (!file) return;
  const text = await readFileSmart(file);
  let rows = parseCSV(text);
  if (rows.length && isNaN(Number(rows[0][0]))) rows = rows.slice(1);
  const parsed = rows.filter(r => r.length>=2 && r[0].trim()!=='' && r[1].trim()!=='').map(r => ({ number:r[0].trim(), name:r[1].trim() }));
  pendingRosterRows = parsed;
  const area = document.getElementById('rosterPreviewArea');
  if (parsed.length === 0){ area.innerHTML = '<div class="hint" style="color:var(--brick);margin-top:10px;">읽을 수 있는 학생 정보가 없어요.</div>'; return; }
  area.innerHTML = `
    <div class="preview-box">${parsed.map(p => `<div>${escapeHtml(p.number)}번 ${escapeHtml(p.name)}</div>`).join('')}</div>
    <div class="radio-row">
      <label><input type="radio" name="rosterMode" value="add" checked> 기존 명단에 추가</label>
      <label><input type="radio" name="rosterMode" value="overwrite"> 기존 명단 덮어쓰기</label>
    </div>
    <button class="btn btn-primary" onclick="confirmRosterUpload()">${parsed.length}명 반영하기</button>
  `;
}

function confirmRosterUpload(){
  if (!pendingRosterRows) return;
  const mode = document.querySelector('input[name=rosterMode]:checked').value;
  if (mode === 'overwrite' && !confirm('기존 명단을 지우고 새 명단으로 덮어쓸까요?')) return;
  const updates = {};
  pendingRosterRows.forEach(p => { const key = db.ref('rosters/' + selectedClassId).push().key; updates[key] = p; });
  const ref = db.ref('rosters/' + selectedClassId);
  const after = () => {
    showToast('명단을 반영했어요'); pendingRosterRows = null;
    document.getElementById('rosterFile').value = '';
    document.getElementById('rosterPreviewArea').innerHTML = '';
  };
  (mode === 'overwrite' ? ref.set(updates) : ref.update(updates)).then(after);
}

// ======================================================
// 문제 세트 관리
// ======================================================

let questionSets = {};
let questionsBySet = {};
let selectedSetId = null;
let pendingQuestionRows = null;

db.ref('questionSets').on('value', snap => {
  const all = snap.val() || {};
  questionSets = {}; questionsBySet = {};
  Object.entries(all).forEach(([id, v]) => { questionSets[id] = { name: v.name }; questionsBySet[id] = v.questions || {}; });
  renderSetList();
  if (selectedSetId) renderSetDetail();
  renderCreateFormSetOptions();
});

function renderSetList(){
  const el = document.getElementById('setList');
  const ids = Object.keys(questionSets);
  if (ids.length === 0){ el.innerHTML = '<div class="empty-msg">등록된 문제 세트가 없어요.</div>'; return; }
  el.innerHTML = ids.map(id => {
    const s = questionSets[id]; const count = Object.keys(questionsBySet[id]||{}).length;
    const sel = id === selectedSetId ? 'selected' : '';
    return `<div class="list-item ${sel}" onclick="selectSet('${id}')">
      <div><div class="name">${escapeHtml(s.name)}</div><div class="sub">문제 ${count}개</div></div>
    </div>`;
  }).join('');
}

function addQuestionSet(){
  const input = document.getElementById('newSetName');
  const name = input.value.trim();
  if (!name){ showToast('세트 이름을 입력해주세요'); return; }
  const ref = db.ref('questionSets').push();
  ref.set({ name, createdAt: Date.now() }).then(() => { input.value=''; showToast('문제 세트를 추가했어요'); selectedSetId = ref.key; });
}

function selectSet(id){ selectedSetId = id; renderSetList(); renderSetDetail(); }

function renderSetDetail(){
  const s = questionSets[selectedSetId];
  const el = document.getElementById('setDetail');
  if (!s){ el.innerHTML = '<div class="empty-msg">왼쪽에서 문제 세트를 선택하거나 새로 추가하세요.</div>'; return; }
  const qs = questionsBySet[selectedSetId] || {};
  const list = Object.entries(qs).sort((a,b) => (a[1].order||0)-(b[1].order||0));

  el.innerHTML = `
    <div class="detail-header"><div class="detail-title">${escapeHtml(s.name)}</div></div>
    <div class="section">
      <div class="section-title">문제 목록 (${list.length}개)</div>
      <table>
        <thead><tr><th style="width:40px">#</th><th>문제</th><th style="width:70px"></th></tr></thead>
        <tbody>
          ${list.map(([qid,q],i) => `
            <tr><td>${i+1}</td>
            <td><textarea rows="1" style="width:100%;" onblur="updateQuestionText('${qid}', this.value)">${escapeHtml(q.text)}</textarea></td>
            <td class="row-actions"><button class="btn btn-danger btn-small" onclick="deleteQuestion('${qid}')">삭제</button></td></tr>
          `).join('') || '<tr><td colspan="3" class="empty-msg">등록된 문제가 없어요.</td></tr>'}
        </tbody>
      </table>
    </div>
    <div class="section">
      <div class="section-title">여러 줄 한 번에 추가</div>
      <textarea class="bulk" id="bulkQuestions" placeholder="한 줄에 문제 하나씩 붙여넣으세요."></textarea>
      <div style="margin-top:8px;"><button class="btn btn-primary" onclick="addBulkQuestions()">추가</button></div>
    </div>
    <div class="section">
      <div class="section-title">CSV로 올리기</div>
      <div class="upload-box">
        <div class="hint">문제 열 하나만 있으면 돼요. 다른 열이 있어도 무시해요.</div>
        <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
          <input type="file" id="questionFile" accept=".csv" onchange="handleQuestionFile(this.files[0])">
          <button class="btn btn-ghost btn-small" onclick="downloadQuestionTemplate()">양식 다운로드</button>
        </div>
        <div id="questionPreviewArea"></div>
      </div>
    </div>
    <div class="section"><button class="btn btn-danger" onclick="deleteSet('${selectedSetId}')">이 세트 삭제</button></div>
  `;
}

function nextOrder(setId){
  const qs = questionsBySet[setId] || {};
  const orders = Object.values(qs).map(q => q.order||0);
  return orders.length ? Math.max(...orders)+1 : 0;
}

function updateQuestionText(qid, text){
  text = text.trim(); if (!text) return;
  db.ref(`questionSets/${selectedSetId}/questions/${qid}/text`).set(text);
}

function deleteQuestion(qid){
  if (!confirm('이 문제를 삭제할까요?')) return;
  db.ref(`questionSets/${selectedSetId}/questions/${qid}`).remove();
}

function deleteSet(setId){
  const name = questionSets[setId]?.name || '';
  if (!confirm(`"${name}" 세트를 삭제할까요?\n안에 있는 문제도 함께 삭제되며 되돌릴 수 없어요.`)) return;
  db.ref('questionSets/' + setId).remove();
  selectedSetId = null;
  document.getElementById('setDetail').innerHTML = '<div class="empty-msg">왼쪽에서 문제 세트를 선택하거나 새로 추가하세요.</div>';
}

function addBulkQuestions(){
  const el = document.getElementById('bulkQuestions');
  const lines = el.value.split('\n').map(l => l.trim()).filter(l => l!=='');
  if (lines.length === 0){ showToast('추가할 문제를 입력해주세요'); return; }
  let order = nextOrder(selectedSetId);
  const updates = {};
  lines.forEach(text => { const key = db.ref(`questionSets/${selectedSetId}/questions`).push().key; updates[key] = { text, order: order++ }; });
  db.ref(`questionSets/${selectedSetId}/questions`).update(updates).then(() => { el.value=''; showToast(`${lines.length}개 문제를 추가했어요`); });
}

async function handleQuestionFile(file){
  if (!file) return;
  const text = await readFileSmart(file);
  const rows = parseCSV(text);
  if (rows.length === 0){ document.getElementById('questionPreviewArea').innerHTML = '<div class="hint" style="color:var(--brick);margin-top:10px;">파일을 읽을 수 없어요.</div>'; return; }
  let colIndex = rows[0].length - 1; let startRow = 0;
  const headerIdx = rows[0].findIndex(h => h.trim() === '문제');
  if (headerIdx !== -1){ colIndex = headerIdx; startRow = 1; }
  const parsed = rows.slice(startRow).map(r => (r[colIndex]||'').trim()).filter(t => t!=='');
  pendingQuestionRows = parsed;
  const area = document.getElementById('questionPreviewArea');
  if (parsed.length === 0){ area.innerHTML = '<div class="hint" style="color:var(--brick);margin-top:10px;">읽을 수 있는 문제가 없어요.</div>'; return; }
  area.innerHTML = `
    <div class="preview-box">${parsed.map(t => `<div>${escapeHtml(t)}</div>`).join('')}</div>
    <div class="radio-row">
      <label><input type="radio" name="questionMode" value="add" checked> 기존 문제에 이어 붙이기</label>
      <label><input type="radio" name="questionMode" value="overwrite"> 기존 문제 지우고 새로 채우기</label>
    </div>
    <button class="btn btn-primary" onclick="confirmQuestionUpload()">${parsed.length}개 반영하기</button>
  `;
}

function confirmQuestionUpload(){
  if (!pendingQuestionRows) return;
  const mode = document.querySelector('input[name=questionMode]:checked').value;
  const finish = () => {
    showToast('문제를 반영했어요'); pendingQuestionRows = null;
    document.getElementById('questionFile').value = '';
    document.getElementById('questionPreviewArea').innerHTML = '';
  };
  const write = (startOrder) => {
    const updates = {}; let order = startOrder;
    pendingQuestionRows.forEach(text => { const key = db.ref(`questionSets/${selectedSetId}/questions`).push().key; updates[key] = { text, order: order++ }; });
    return db.ref(`questionSets/${selectedSetId}/questions`).update(updates);
  };
  if (mode === 'overwrite'){
    if (!confirm('기존 문제를 모두 지우고 새 문제로 채울까요?')) return;
    db.ref(`questionSets/${selectedSetId}/questions`).remove().then(() => write(0)).then(finish);
  } else {
    write(nextOrder(selectedSetId)).then(finish);
  }
}

async function submitCreateGame(){
  const classId = document.getElementById('createClassSelect').value;
  const setId = document.getElementById('createSetSelect').value;
  if (!classId){ showToast('학급을 먼저 등록해주세요'); return; }
  if (!setId){ showToast('문제 세트를 먼저 등록해주세요'); return; }
  const qCount = Object.keys(questionsBySet[setId]||{}).length;
  if (qCount === 0){ showToast('선택한 세트에 문제가 없어요'); return; }

  const durationMinutes = Number(document.getElementById('createDuration').value) || 15;
  const mode = document.querySelector('input[name=gameMode]:checked').value;
  const isTeam = mode === 'team';
  const teamCount = Math.max(2, Math.min(8, Number(document.getElementById('createTeamCount').value) || 4));
  const teamNames = document.getElementById('createTeamNames').value.split(',').map(s => s.trim()).filter(Boolean);
  const challengeEnabled = document.getElementById('createChallenge').checked;
  const turnTimerSec = Number(document.getElementById('createTurnTimer').value) || 0;
  const groupCount = isTeam ? 1 : (Number(document.getElementById('createGroupCount').value) || 1);
  const maxPerGroup = isTeam ? teamCount : (Number(document.getElementById('createMaxPerGroup').value) || 4);
  const deckMode = isTeam ? 'random' : document.querySelector('input[name=deckMode]:checked').value;
  const jc = document.getElementById('createJudgeCancel').value;
  const judgeCancelSec = jc === '' ? 3 : Math.max(0, Math.min(10, Number(jc) || 0));
  const deckCap = Number(document.getElementById('createDeckCap').value) || null;

  const cardConfig = {};
  CARD_CONFIG_ORDER.forEach(type => {
    cardConfig[type] = {
      enabled: document.getElementById(`cfg_${type}_on`).checked,
      ratio: Math.max(0, Number(document.getElementById(`cfg_${type}_ratio`).value) || 0) / 100
    };
  });

  saveCardConfig(cardConfig);

  const gameId = await createGame({
    classId, className: classes[classId].name,
    questionSetId: setId, questionSetName: questionSets[setId].name,
    durationMinutes, groupCount, maxPerGroup, deckMode, cardConfig, deckCap, judgeCancelSec,
    mode, teamCount, teamNames, challengeEnabled, turnTimerSec
  });
  showToast('게임을 만들었어요');
  creatingGame = false;
  selectedGameId = gameId;
}

function findSeatOf(groups, groupIndex, pid){
  if (!groupIndex || !groups[groupIndex]) return null;
  const found = Object.entries(groups[groupIndex].seats||{}).find(([,v]) => v===pid);
  return found ? Number(found[0]) : null;
}

function renderDndBoard(g){
  const board = document.getElementById('dndBoard');
  if (!board) return;
  const players = g.players || {};
  const groups = g.groups || {};
  const zones = ['unassigned', ...Object.keys(groups).sort((a,b)=>a-b)];

  board.innerHTML = zones.map(zoneKey => {
    const title = zoneKey === 'unassigned' ? '미배정' : `${zoneKey}조`;
    const members = Object.entries(players).filter(([pid,p]) => {
      if (zoneKey === 'unassigned') return !p.groupIndex;
      return String(p.groupIndex) === String(zoneKey);
    }).sort((a,b) => (findSeatOf(groups,zoneKey,a[0])||99) - (findSeatOf(groups,zoneKey,b[0])||99));
    return `<div class="dnd-zone" data-zone="${zoneKey}"
              ondragover="event.preventDefault(); this.classList.add('dragover');"
              ondragleave="this.classList.remove('dragover');"
              ondrop="handleDndDrop(event,'${zoneKey}',null)">
      <div class="zone-title">${title} ${zoneKey!=='unassigned' ? `(${members.length}/${g.meta.maxPerGroup})` : ''}</div>
      ${members.map(([pid,p]) => `<div class="dnd-chip" draggable="true"
            ondragstart="handleDndStart(event,'${pid}','${p.groupIndex||''}')"
            ondragover="event.preventDefault(); event.stopPropagation(); this.classList.add('dragover');"
            ondragleave="this.classList.remove('dragover');"
            ondrop="event.stopPropagation(); handleDndDrop(event,'${zoneKey}','${pid}')">${escapeHtml(p.name)}</div>`).join('') || '<div class="hint">없음</div>'}
    </div>`;
  }).join('');
}

function handleDndStart(e, pid, fromGroup){
  e.dataTransfer.setData('text/plain', JSON.stringify({ pid, fromGroup }));
}

// toZone에 드롭. ontoPid가 있으면 그 학생과 자리를 맞바꿔요(순서 조정), 없으면 빈 자리로 이동해요.
async function handleDndDrop(e, toZone, ontoPid){
  e.preventDefault();
  document.querySelectorAll('.dnd-zone.dragover, .dnd-chip.dragover').forEach(el => el.classList.remove('dragover'));
  const data = JSON.parse(e.dataTransfer.getData('text/plain'));
  if (data.pid === ontoPid) return;
  if (toZone === 'unassigned'){ showToast('미배정으로는 옮길 수 없어요'); return; }

  const g = games[selectedGameId];
  const groups = g.groups || {};

  if (ontoPid){
    // 자리 맞바꾸기 (한 번에 원자적으로 처리해야 서로 자리를 기다리다 멈추지 않아요)
    const fromGroup = data.fromGroup || toZone;
    const fromSeat = findSeatOf(groups, fromGroup, data.pid);
    const toSeat = findSeatOf(groups, toZone, ontoPid);
    if (!fromSeat || !toSeat){ showToast('자리를 찾지 못했어요'); return; }
    await swapPlayers(selectedGameId, data.pid, fromGroup, fromSeat, ontoPid, toZone, toSeat);
    showToast('순서를 바꿨어요');
    return;
  }

  if (String(data.fromGroup) === String(toZone)) return;
  const seats = (groups[toZone] && groups[toZone].seats) || {};
  let seat = null;
  for (let s = 1; s <= g.meta.maxPerGroup; s++){ if (!seats[s]){ seat = s; break; } }
  if (!seat){ showToast(`${toZone}조 자리가 다 찼어요`); return; }
  await adminMovePlayer(selectedGameId, data.pid, data.fromGroup || null, toZone, seat);
  showToast('자리를 옮겼어요');
}

async function handleStartGame(gameId){
  const g = games[gameId];
  const setId = g.meta.questionSetId;
  const qs = questionsBySet[setId] || {};
  const allQuestions = Object.entries(qs).map(([id,q]) => ({ id, text: q.text }));
  if (allQuestions.length === 0){ showToast('문제가 없어서 시작할 수 없어요'); return; }
  await startGame(gameId, allQuestions);
  showToast('게임을 시작했어요');
}

const PHASE_LABELS = {
  lobby:'대기중', pre_turn:'턴 대기', awaiting_answer:'답변·판정 중', judge_pending:'판정 반영 대기',
  steal_pick:'강탈 대상 선택 중', awaiting_defense:'방어 대기 중',
  challenge_pick:'도전 팀 선택 중', challenge_answer:'도전 답변 중', ended:'모둠 종료'
};

function renderMonitorDetail(g){
  const el = document.getElementById('gameDetail');
  const status = g.meta.status;

  el.innerHTML = `
    <div class="detail-header">
      <div><div class="detail-title">${escapeHtml(g.meta.className)}</div><div class="hint">${escapeHtml(g.meta.questionSetName)} · ${statusLabel(status)}</div></div>
      <div style="display:flex; gap:8px;">
        ${g.meta.mode === 'team' ? `<button class="btn btn-primary" onclick="openBoard('${selectedGameId}')">칠판 화면 열기</button>` : ''}
        ${status === 'playing' ? `<button class="btn btn-amber" onclick="pauseGame('${selectedGameId}')">일시정지</button>` : ''}
        ${status === 'paused' ? `<button class="btn btn-primary" onclick="resumeGame('${selectedGameId}')">재개</button>` : ''}
        <button class="btn btn-danger" onclick="handleEndGame('${selectedGameId}')">게임 종료</button>
      </div>
    </div>
    <div id="timerLine" class="hint" style="font-size:14px; margin-bottom:14px;"></div>
    <div id="groupCards"></div>
  `;
  renderTimerLine(g);
  renderGroupCards(g);
}

function renderTimerLine(g){
  const line = document.getElementById('timerLine');
  if (!line) return;
  const status = g.meta.status;
  if (status === 'paused'){
    line.textContent = `일시정지됨 · 남은 시간 ${formatClock(g.meta.remainingMsAtPause)}`;
    return;
  }
  const endAt = g.meta.endAt;
  const remaining = endAt ? endAt - serverNow() : null;
  line.textContent = remaining != null ? `남은 시간 ${formatClock(remaining)}` : '시간 계산 중...';
}

function renderGroupCards(g){
  const wrap = document.getElementById('groupCards');
  const players = g.players || {};
  const groups = g.groups || {};
  wrap.innerHTML = Object.keys(groups).sort((a,b)=>a-b).map(gi => {
    const grp = groups[gi];
    const order = computeOrder(grp.seats||{}, grp.excludedIds||{});
    const curName = players[grp.currentPlayerId]?.name || '-';
    const judgeName = players[grp.judgeId]?.name || '-';
    const deckLeft = (grp.deck||[]).length;
    const stuck = grp.turnStartedAt && (Date.now() - grp.turnStartedAt > 3*60*1000) && grp.phase !== 'ended';
    const expanded = expandedGroup === gi;
    return `
      <div class="panel" style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleGroupExpand('${gi}')">
          <div>
            <strong>${gLabel(g, gi)}</strong>
            <span class="badge" style="margin-left:8px;">${PHASE_LABELS[grp.phase]||grp.phase}</span>
            ${stuck ? '<span class="badge" style="background:#FBEAE5;color:#B4472D; margin-left:6px;">진행 지연 의심</span>' : ''}
          </div>
          <div class="hint">플레이어 ${curName} · 판정자 ${judgeName} · 덱 ${deckLeft}장</div>
        </div>
        ${expanded ? renderGroupExpanded(gi, grp, players, order) : ''}
      </div>
    `;
  }).join('') || '<div class="empty-msg">모둠이 없어요.</div>';
}

function toggleGroupExpand(gi){
  expandedGroup = expandedGroup === gi ? null : gi;
  renderGameDetail();
}

function statOf(grp, pid, key){ return ((grp.stats || {})[pid] || {})[key] || 0; }

function renderGroupExpanded(gi, grp, players, order){
  const hands = grp.hands || {};
  return `
    <div class="section" style="margin-top:14px;">
      <table>
        <thead><tr><th>이름</th><th>점수</th><th>강탈 성공/당함</th><th>손패 총</th><th style="width:100px"></th></tr></thead>
        <tbody>
          ${order.map(pid => {
            const h = hands[pid] || emptyHand();
            return `<tr>
              <td>${escapeHtml(players[pid]?.name||'?')}</td>
              <td>${handScore(h)}</td>
              <td>${statOf(grp,pid,'steals')} / ${statOf(grp,pid,'stolen')}</td>
              <td>${handTotal(h)}</td>
              <td><button class="btn btn-ghost btn-small" onclick="openAdjustPanel('${gi}','${pid}')">카드 조정</button></td>
            </tr>`;
          }).join('') || '<tr><td colspan="5" class="empty-msg">참가자가 없어요</td></tr>'}
        </tbody>
      </table>
      <div id="adjustPanel_${gi}"></div>
    </div>
    <div class="section" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-small" onclick="forceNextTurn('${selectedGameId}','${gi}')">강제 다음 턴</button>
      <button class="btn btn-danger btn-small" onclick="handleRestartGroup('${selectedGameId}','${gi}')">모둠 재시작</button>
    </div>
    <div class="section">
      <div class="section-title" style="font-size:12.5px;">참가자 제외/복귀</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        ${Object.entries(grp.seats||{}).map(([seat,pid]) => {
          const excluded = grp.excludedIds && grp.excludedIds[pid];
          return `<button class="btn btn-small ${excluded?'btn-danger':'btn-ghost'}" onclick="excludePlayer('${selectedGameId}','${gi}','${pid}',${!excluded})">
            ${escapeHtml(players[pid]?.name||'?')} ${excluded?'(제외됨 · 복귀)':'(제외)'}
          </button>`;
        }).join('')}
      </div>
    </div>
  `;
}

function openAdjustPanel(gi, pid){
  const el = document.getElementById(`adjustPanel_${gi}`);
  if (!el) return;
  const types = ['general','pass','jump','turn','defense'];
  el.innerHTML = `
    <div class="confirm-banner">
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        ${types.map(t => `
          <span class="chip">${cardIcon(t)} ${t === 'general' ? '점수 카드' : CARD_LABELS[t]}
            <button class="btn btn-ghost btn-small" onclick="adjustHandCard('${selectedGameId}','${gi}','${pid}','${t}',-1)">-</button>
            <button class="btn btn-ghost btn-small" onclick="adjustHandCard('${selectedGameId}','${gi}','${pid}','${t}',1)">+</button>
          </span>
        `).join('')}
      </div>
      <button class="btn btn-ghost btn-small" onclick="document.getElementById('adjustPanel_${gi}').innerHTML=''">닫기</button>
    </div>
  `;
}

async function handleEndGame(gameId){
  if (!confirm('게임을 종료할까요?')) return;
  await endGame(gameId);
}

async function handleRestartGroup(gameId, gi){
  if (!confirm(`${gi}조를 처음부터 다시 시작할까요? 손패와 진행 상황이 모두 초기화돼요.`)) return;
  const g = games[gameId];
  const setId = g.meta.questionSetId;
  const allQuestions = Object.entries(questionsBySet[setId]||{}).map(([id,q]) => ({ id, text: q.text }));
  const deckCap = g.meta.deckCap || null;
  await restartGroup(gameId, gi, allQuestions, g.meta.cardConfig, g.meta.deckMode, deckCap);
  showToast('모둠을 다시 시작했어요');
}

let resultsTab = 'scores';
function setResultsTab(t){ resultsTab = t; renderGameDetail(); }

// kind: 'unknown'(모두 모름) | 'incorrect'(오답)
function collectQuestionStats(g, kind){
  const groups = g.groups || {};
  const perGroup = {};
  const total = {};
  const byCount = (a, b) => b.count - a.count || String(a.text).localeCompare(String(b.text), 'ko');
  Object.keys(groups).sort((a,b)=>a-b).forEach(gi => {
    const qs = groups[gi].qstats || {};
    const list = Object.entries(qs)
      .map(([qid, s]) => ({ qid, text: s.text || '(문제 내용 없음)', count: s[kind] || 0 }))
      .filter(r => r.count > 0)
      .sort(byCount);
    perGroup[gi] = list;
    list.forEach(r => {
      const t = total[r.qid] = total[r.qid] || { qid: r.qid, text: r.text, count: 0, byGroup: {} };
      t.count += r.count;
      t.byGroup[gi] = r.count;
    });
  });
  return { perGroup, totalList: Object.values(total).sort(byCount) };
}

// 모둠별 목록 접기/펼치기 상태
let openStatGroups = {};
function toggleStatGroup(key){ openStatGroups[key] = !openStatGroups[key]; renderGameDetail(); }

function renderQuestionStatBlocks(g, kind){
  const groups = g.groups || {};
  const hasAny = Object.values(groups).some(grp => grp.qstats && Object.keys(grp.qstats).length > 0);
  if (!hasAny){
    return '<div class="empty-msg">문제별 기록이 없어요. 기록 기능이 추가되기 전에 진행한 게임이거나, 판정된 문제가 아직 없는 게임이에요.</div>';
  }
  const label = kind === 'unknown' ? '모두 모름' : '오답';
  const { perGroup, totalList } = collectQuestionStats(g, kind);
  const listHtml = list => list.length
    ? `<ol class="qstat-list">${list.map(r => `<li><span class="qtxt">${escapeHtml(r.text)}</span><span class="qcount ${kind}">${r.count}회</span></li>`).join('')}</ol>`
    : `<div class="hint">${label} 기록이 없어요 👏</div>`;

  const totalBlock = `<div class="panel stat-total" style="margin-bottom:12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;" onclick="openStatSlides('${kind}')">
      <div><div style="font-weight:700;">전체 모둠 합산</div><div class="hint">${totalList.length}문제 · 눌러서 크게 넘겨보기</div></div>
      <button class="btn btn-primary btn-small" onclick="event.stopPropagation(); openStatSlides('${kind}')">▶ 슬라이드로 보기</button>
    </div>`;
  const groupBlocks = Object.keys(perGroup).map(gi => {
    const key = `${kind}_${gi}`;
    const open = !!openStatGroups[key];
    return `<div class="panel" style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleStatGroup('${key}')">
        <div style="font-weight:700;">${gLabel(g, gi)} <span class="hint">(${perGroup[gi].length}문제)</span></div>
        <span class="hint">${open ? '▲ 접기' : '▼ 펼치기'}</span>
      </div>
      ${open ? `<div style="margin-top:8px;">${listHtml(perGroup[gi])}</div>` : ''}
    </div>`;
  }).join('');
  return totalBlock + groupBlocks;
}

// ---------- 전체 합산: PPT처럼 크게 넘겨보기 ----------
let statSlide = null;
function openStatSlides(kind){
  const g = games[selectedGameId];
  const { totalList } = collectQuestionStats(g, kind);
  if (!totalList.length){ showToast('기록이 없어요'); return; }
  statSlide = { kind, items: totalList, i: 0, className: g.meta.className, game: g };
  document.addEventListener('keydown', statSlideKey);
  renderStatSlide();
}
function renderStatSlide(){
  if (!statSlide) return;
  let el = document.getElementById('statSlide');
  if (!el){ el = document.createElement('div'); el.id = 'statSlide'; el.className = 'slide-overlay'; document.body.appendChild(el); }
  const { kind, items, i, className } = statSlide;
  const it = items[i];
  const title = kind === 'unknown' ? '🤷 모두 모름 문제' : '❌ 오답 많은 문제';
  const groupsTxt = Object.entries(it.byGroup).sort((a,b) => b[1]-a[1]).map(([gi,n]) => `<span>${gLabel(statSlide.game, gi)} ${n}회</span>`).join('');
  el.innerHTML = `
    <div class="slide-top">
      <div class="ttl">${escapeHtml(className)} · ${title}</div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-small" onclick="statSlideFullscreen()">전체화면</button>
        <button class="btn btn-small" onclick="closeStatSlide()">닫기 ✕</button>
      </div>
    </div>
    <div class="slide-body">
      <div class="slide-rank">${i + 1}위</div>
      <div class="slide-q">${escapeHtml(it.text)}</div>
      <div class="slide-count ${kind}">전체 ${it.count}회</div>
      <div class="slide-groups">${groupsTxt}</div>
    </div>
    <div class="slide-nav">
      <button onclick="statSlideGo(-1)" ${i === 0 ? 'disabled' : ''}>◀</button>
      <div class="pg">${i + 1} / ${items.length}</div>
      <button onclick="statSlideGo(1)" ${i === items.length - 1 ? 'disabled' : ''}>▶</button>
    </div>`;
}
function statSlideGo(d){
  if (!statSlide) return;
  statSlide.i = Math.min(statSlide.items.length - 1, Math.max(0, statSlide.i + d));
  renderStatSlide();
}
function statSlideKey(e){
  if (!statSlide) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); statSlideGo(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); statSlideGo(-1); }
  else if (e.key === 'Escape'){ closeStatSlide(); }
}
function statSlideFullscreen(){
  const el = document.getElementById('statSlide');
  if (!document.fullscreenElement){ if (el && el.requestFullscreen) el.requestFullscreen(); }
  else document.exitFullscreen();
}
function closeStatSlide(){
  document.removeEventListener('keydown', statSlideKey);
  if (document.fullscreenElement) document.exitFullscreen();
  const el = document.getElementById('statSlide');
  if (el) el.remove();
  statSlide = null;
}

function renderResultsDetail(g){
  const el = document.getElementById('gameDetail');
  const players = g.players || {};
  const groups = g.groups || {};

  const groupBlocks = Object.keys(groups).sort((a,b)=>a-b).map(gi => {
    const hands = groups[gi].hands || {};
    const rows = Object.entries(hands).map(([pid,h]) => ({
      pid, name: players[pid]?.name || '?', score: handScore(h),
      steals: statOf(groups[gi], pid, 'steals'), stolen: statOf(groups[gi], pid, 'stolen')
    })).sort((a,b) => b.score - a.score);

    let rank = 0, prevScore = null, shown = [];
    rows.forEach((r,i) => {
      if (r.score !== prevScore){ rank = i+1; prevScore = r.score; }
      shown.push({...r, rank});
    });

    return `<div class="panel" style="margin-bottom:10px;">
      <div style="font-weight:700; margin-bottom:8px;">${g.meta.mode === 'team' ? '최종 순위' : gi + '조'}</div>
      <table class="results-table">
        <thead><tr><th>순위</th><th>이름</th><th>점수</th><th>강탈 성공</th><th>강탈당함</th></tr></thead>
        <tbody>
          ${shown.map(r => `<tr class="${r.rank===1?'rank-1':''}"><td>${r.rank}</td><td>${escapeHtml(r.name)}</td><td>${r.score}</td><td>${r.steals}</td><td>${r.stolen}</td></tr>`).join('') || '<tr><td colspan="5" class="empty-msg">참가자가 없어요</td></tr>'}
        </tbody>
      </table>
    </div>`;
  }).join('');

  let body;
  if (resultsTab === 'unknown') body = renderQuestionStatBlocks(g, 'unknown');
  else if (resultsTab === 'incorrect') body = renderQuestionStatBlocks(g, 'incorrect');
  else body = groupBlocks || '<div class="empty-msg">모둠이 없어요.</div>';

  const tabBtn = (key, text) => `<button class="btn btn-small ${resultsTab===key?'btn-primary':'btn-ghost'}" onclick="setResultsTab('${key}')">${text}</button>`;

  el.innerHTML = `
    <div class="detail-header">
      <div><div class="detail-title">${escapeHtml(g.meta.className)}</div><div class="hint">${escapeHtml(g.meta.questionSetName)} · 종료됨</div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="downloadQuestionStatsCSV('${selectedGameId}')">문제 분석 CSV</button>
        <button class="btn btn-ghost" onclick="downloadResultsCSV('${selectedGameId}')">결과 CSV 내려받기</button>
      </div>
    </div>
    <div class="tab-row">
      ${tabBtn('scores', '🏆 점수 결과')}
      ${tabBtn('unknown', '🤷 모두 모름 문제')}
      ${tabBtn('incorrect', '❌ 오답 많은 문제')}
    </div>
    ${body}
  `;
}

function downloadQuestionStatsCSV(gameId){
  const g = games[gameId];
  const groups = g.groups || {};
  const rows = [['학급','모둠','문제','정답 횟수','오답 횟수','모두 모름 횟수']];
  Object.keys(groups).sort((a,b)=>a-b).forEach(gi => {
    const list = Object.values(groups[gi].qstats || {}).slice()
      .sort((a,b) => ((b.unknown||0)-(a.unknown||0)) || ((b.incorrect||0)-(a.incorrect||0)));
    list.forEach(s => rows.push([g.meta.className, gi, s.text||'', s.correct||0, s.incorrect||0, s.unknown||0]));
  });
  if (rows.length === 1){ showToast('내려받을 문제별 기록이 없어요'); return; }
  const csv = rows.map(r => r.map(v => `"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
  downloadTextFile(`${g.meta.className}_문제분석.csv`, csv, true);
}

function downloadResultsCSV(gameId){
  const g = games[gameId];
  const players = g.players || {};
  const groups = g.groups || {};
  const rows = [['학급','모둠','번호','이름','점수','순위','강탈 카드 정답','강탈 성공','강탈당함']];
  Object.keys(groups).sort((a,b)=>a-b).forEach(gi => {
    const hands = groups[gi].hands || {};
    const list = Object.entries(hands).map(([pid,h]) => ({
      pid, name: players[pid]?.name||'', number: players[pid]?.number||'', score: handScore(h),
      stealSolved: statOf(groups[gi], pid, 'stealSolved'), steals: statOf(groups[gi], pid, 'steals'), stolen: statOf(groups[gi], pid, 'stolen')
    })).sort((a,b) => b.score-a.score);
    let rank=0, prevScore=null;
    list.forEach((r,i) => {
      if (r.score !== prevScore){ rank=i+1; prevScore=r.score; }
      rows.push([g.meta.className, gi, r.number, r.name, r.score, rank, r.stealSolved, r.steals, r.stolen]);
    });
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
  downloadTextFile(`${g.meta.className}_결과.csv`, csv, true);
}

// 1초마다 타이머 라인을 갱신
setInterval(() => {
  if (selectedGameId && games[selectedGameId] && !creatingGame){
    const status = games[selectedGameId].meta.status;
    if (status === 'playing' || status === 'paused') renderTimerLine(games[selectedGameId]);
  }
}, 1000);
